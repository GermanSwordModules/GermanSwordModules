About=Quelle: lesekammer.de (https://lesekammer.de/2024/12/12/thonas-von-celano-de-die-iudicii-2024/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: November 2024, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\parWohl von kaum einem Kirchenlied habe ich mehr Bearbeitungen und Übersetzungen gefunden wie von Celano’s „De die iudicii“. Und noch immer kommen verschiedene Autoren hinzu. Teilweise sind die Namen nicht bekannt oder nur abgekürzt, doch auch sehr bekannte Dichter haben sich dieses Liedes angenommen.\parWas mich überrascht: Trotz des doch sehr eingeschränkten Quellenmaterials – das Lied hat weniger als 20 Strophen – schaffen es viele Autoren, Ihre eigene Prägung und teilweise ganz neue Blickwinkel hinzuzufügen.\parIch hoffe, für Euch ist etwas Interessantes dabei.\parGruß & Segen,\parAndreas
