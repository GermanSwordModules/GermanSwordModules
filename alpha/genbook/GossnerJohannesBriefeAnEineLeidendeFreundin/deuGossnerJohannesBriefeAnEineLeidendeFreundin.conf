About=Quelle: lesekammer.de (https://lesekammer.de/2023/12/15/gossner-johannes-evangelista/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: Januar 2024, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIch stimme nicht mit allem überein, was die hier veröffentlichten Autoren geschrieben haben – doch möchte ich meine Erkenntnis auch nicht absolut setzen. Darum habe ich auch Schriften veröffentlicht, die meiner Erkenntnis widersprechen, so weit es sich nicht um klare Irrlehren geht.\parDie hier veröffentlichten Texte sind zum Teil von mir sprachlich (jedoch nicht inhaltlich) überarbeitet – doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\parDie nachstehenden Briefe schrieb der selige Gossner in den Jahren 1826-1833 an meine teure, nun schon seit mehr als fünfzig Jahren heimgegangene Großmutter. Dieselbe war eine in der Schule vielfacher Leiden bewährte Christin und eine treue Jüngerin des HErrn.\parDa ich weiß, dass diese Briefe der Verklärten großen Trost und reiche Erquickung und Stärkung gebracht haben, so entschloss ich mich zu deren Veröffentlichung; in der Überzeugung, dass dieselben in ihrer schlichten Einfachheit und der herzenswarmen Darreichung des himmlischen Trostes auch jetzt noch manches leidende Herz trösten, stärken und aufrichten werden.\parIst es doch fast, als sähe man den würdigen Freund eintreten in das kleine Zimmer, als fühlte man seinen aufrichtig teilnehmenden Händedruck, und als bliebe nach seinem Scheiden ein stiller Friedenshauch auch für den Leser zurück. Möge denn des HErrn Segen auf dem kleinen Büchlein ruhen, und wenn durch dasselbe, hier oder dort, ein trübes Auge erhellt und eine bekümmerte Seele ermutigt wird, oder ein, in schweren Leiden ringendes Christenherz Trost, Friede und Freude in seinem Heiland findet, so ist der Wunsch der Herausgeberin erfüllt.\parDresden, in der Passionszeit 1888.\parH. v. L.
