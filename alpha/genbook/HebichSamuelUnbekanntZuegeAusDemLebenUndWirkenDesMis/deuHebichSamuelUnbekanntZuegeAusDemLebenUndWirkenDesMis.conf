About=Quelle: lesekammer.de (https://lesekammer.de/2023/08/22/hebich-samuel-buecher-2023/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: Oktober 2021, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\par2022 – ich arbeite seit September 2021 daran, die Bücher für dieses Jahr zu überarbeiten. Das bedeutet, dass neue Bücher hinzukommen und bestehende Bücher aktualisiert werden. Und da mittlerweile in der Lesekammer mehr als 1.000 Bücher zum Download stehen, ist das eine Menge Arbeit. Deshalb habe ich so früh wie möglich damit angefangen.\parAn den Büchern, die es schon gibt, ändert sich das Vorwort. Zusätzlich möchte ich Bilder der jeweiligen Autoren hinzufügen, so weit mir diese vorliegen. Und ein neuer Spendenaufruf steht auf der letzten Seite – es geht um die Kirche Jung St. Peter in Straßburg. Wer mich kennt, der weiß, dass ich für die Kirche der Reformationszeit in Straßburg eine ganz besondere Vorliebe habe – daher der Spendenaufruf für die Kirche, in der Capito und Fagio wirkten. Auch sprachlich wurden sie teilweise überarbeitet, wo möglich wurden sie auch erweitert.\parEuch allen wünsche ich Gottes reichen Segen und dass Ihr für Euch interessante Texte hier findet. Für Anregungen bin ich immer dankbar.\parGruß & Segen,\parAndreas\par\parSpendenaufruf (lesekammer.de):
