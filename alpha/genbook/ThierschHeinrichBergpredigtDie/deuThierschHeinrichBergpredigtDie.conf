About=Quelle: lesekammer.de (https://lesekammer.de/2023/08/15/heinrich-wilhelm-josias-thiersch-buecher-2023/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme entnommen. Hier sind zumeist auch die Quellangaben zu finden.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\parDiese Bücher sind nicht für den Verkauf, sondern für die kostenlose Weitergabe gedacht. Es kommt jedoch immer wieder zu Fragen, ob und wie man die Arbeit der Glaubensstimme finanziell unterstützen kann. Glücklicherweise bin ich in der Situation, dass ich durch meine Arbeit finanziell unabhängig bin. Daher bitte ich darum, Spenden an die Deutsche Missionsgesellschaft zu senden. Wenn Ihr mir noch einen persönlichen Gefallen tun wollt, schreibt als Verwendungszweck „Arbeit Gerald Haupt“ dabei – Gerald ist ein Schulkamerad von mir gewesen und arbeitet als Missionar in Spanien.\parSpendenkonto: IBAN: DE02 6729 2200 0000 2692 04, BIC: GENODE61WIE\parAlternativ bitte ich darum, die Arbeit der Landeskirchlichen Gemeinschaft Schlossplatz 9 in Schwetzingen zu unterstützen. Die Landeskirchliche Gemeinschaft „Schlossplatz 9 in Schwetzingen ist eine evangelische Gemeinde und gehört zum Südwestdeutschen Gemeinschaftsverband e. V. (SGV) mit Sitz in Neustadt/Weinstraße. Der SGV ist ein freies Werk innerhalb der Evangelischen Landeskirche. Ich gehöre dieser Gemeinschaft nicht selber an, und es gibt auch keinen Zusammenhang zwischen der Gemeinde und der Glaubensstimme, doch weiß ich mich ihr im selben Glauben verbunden.\parLANDESKIRCHLICHE GEMEINSCHAFT „SCHLOSSPLATZ 9“ 68723 SCHWETZINGEN\parGemeinschaftspastor: M. Störmer, Mannheimer Str. 76, 68723 Schwetzingen,\parIBAN: DE62 5206 0410 0007 0022 89 Evangelische Bank eG, Kassel\parAndreas Janssen Im Kreuzgewann 4 69181 Leimen\parNatürlich suche ich immer noch Leute, die Zeit und Lust haben, mitzuarbeiten - wer also Interesse hat, melde sich bitte. Meine Email-Adresse ist: webmaster@glaubensstimme.de. Insbesondere suche ich Leute, die Texte abschreiben möchten, bestehende Texte korrigieren oder sprachlich überarbeiten möchten oder die Programmierkenntnisse haben und das Design der Glaubensstimme verschönern können.\par\parVorwort (lesekammer.de):\parWieder einmal ging ein Jahr vorüber, und wir befinden uns am Ende des Jahres 2020 – Zeit, einige Bücher noch aufzuarbeiten, die ich Euch anbieten möchte.\parDieses Jahr hat uns allen eine Menge abverlangt – doch Gott hat uns hindurchgetragen.\parFür mich persönlich bot die Zeit, die ich gewonnen habe, die Gelegenheit, einige neue Bücher zu erstellen. Gleichzeitig überarbeite ich viele der alten Bücher, sei es, um Fehler zu beheben oder neue Inhalte hinzuzufügen. Zunächst möchte ich die bestehenden Autorenbücher bearbeiten, danach sollen dann die Bücher zum Kirchenjahr, die Andachtsbücher und 1-2 neue Reihen aktualisiert werden.\parVielleicht hat aber auch der eine oder die andere Lust, mitzumachen und neue Bücher zu erstellen – sprecht mich einfach an.\parEuch allen wünsche ich Gottes reichen Segen und dass Ihr für Euch interessante Texte hier findet. Für Anregungen bin ich immer dankbar.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\parEs ist eine große Aufgabe, die Worte des Herrn in der Bergpredigt dem christlichen Volk auszulegen und einzuschärfen. Es sind schwere Stellen in diesem Abschnitt des göttlichen Wortes enthalten. Es kommen Gewissensfragen, die aufs tiefste eingreifen, zur Sprache. Möge es mir gelungen sein, sie nach dem Sinne Christi und im Einklang mit der echten apostolischen Tradition zu behandeln!\parMan wird mir zutrauen, dass mir die Kommentare der Gelehrten nicht unbekannt geblieben sind, obwohl ich sie nicht zitiere, sondern mich darauf beschränke, die für die christliche Erkenntnis und das christliche Leben bedeutsamen Ergebnisse darzulegen. Insbesondere wünsche ich die hier gegebene Erklärung des Vaterunsers der Aufmerksamkeit der Leser zu empfehlen. Einige köstliche Winke verdanke ich dem Bibelwerk von Wilhelm Reischl (d.h. Schriften des N.T. Regensburg 1866), das in möglichst bündiger Fassung eine Art von Catena Patrum enthält.\parEs ist mir willkommen und dankenswert, dass mir Gelegenheit gegeben ist, dies Schriftchen, das vor zehn Jahren erschien, noch einmal und zwar in vervollkommneter Gestalt (wie ich hoffe) ans Licht treten zu lassen. Der Abschnitt über den Eid („das Gebot der Wahrhaftigkeit und der Lauterkeit der Rede”) mußte neu ausgearbeitet werden, weil ich in der ersten Ausgabe etwas zu weit gegangen war. Ich hoffe, klar dargetan zu haben, dass der Herr bei den Worten: „Ihr sollt allerdinge nicht schwören”, den von der Obrigkeit auferlegten feierlichen Eid überhaupt nicht im Auge gehabt hat, sondern nur die Beteuerungen des gewöhnlichen Lebens, und dass der Christ den Eid, welchen die Obrigkeit zu fordern ein Recht hat, mit gutem Gewissen leisten darf, obwohl die Anforderung an sich, und mehr noch die Häufigkeit derselben, ein Zeichen des in der Christenheit eingetretenen Verfalls ist und bleibt. Ich ersuche die Besitzer der ersten Ausgabe, von dieser Berichtigung (die übrigens auch schon in der Schrift „über den christlichen Staat” Basel 1875 erschienen ist) Kenntnis zu nehmen und die frühere Fassung als abgetan zu betrachten.\parEin Gegenstand, der in unserer Zeit gründliche Bearbeitung dringend erfordert, ist die Lehre Christi und Seiner Apostel von der Ehe und ihrer Unauflöslichkeit. Was ich hierüber gesagt habe, bedarf allerdings der weiteren Ausführung und Begründung. Indessen ist eine solche schon gegeben, und zwar in dem Buch von Döllinger, welches ich für das bedeutendste und wertvollste seiner Werke halte: „Christentum und Kirche in der Zeit der Grundlegung” (2. Ausg. Regensburg 1868).\parDie protestantische Kirche hat durch die Einführung der Zivilehe in Deutschland und der Schweiz freie Hand bekommen, um ihre Eheordnung zu revidieren und nach Gottes Wort zu gestalten. Dieser Aufgabe sollten gläubige Theologen sich widmen und die hier auftauchenden Fragen treulich nach der Schrift, nicht nach einer von der Schrift abweichenden und verderbten Praxis, zu beantworten suchen. Eine solche Arbeit müsste mit sorgfältiger Berücksichtigung dessen, was Döllinger schon geleistet hat, ausgeführt werden.\parDie alten protestantischen Kirchenordnungen schlossen sich, wie ich an einem anderen Ort zu zeigen gesucht habe („das Verbot der Ehe innerhalb der nahen Verwandtschaft” Augsburg, R. Preyß), in Hinsicht auf die verbotenen Grade genau an das Wort Gottes an. In Beziehung auf Ehescheidung und Wiederverheiratung sind sie von dem christlichen Prinzip abgewichen. Jener erste Schritt hat weiter geführt, die Durchbrechung des Grundsatzes von der Unauflöslichkeit des Bandes hat sich gerächt, indem unaufhaltsam und mit logischer Notwendigkeit jene Versetzung der Ehe von dem heiligen Gebiet auf das profane erfolgte, die in dem preußischen Landrecht und dem Reichsgesetz vom 6. Februar 1875 zum Abschluss gekommen ist. Leider ging dem Verfall der Gesetzgebung der Verfall der Theologie zur Seite. Wie weit auch die Theologen sich in ihren Ansichten über die Ehe von der Heiligen Schrift entfernt haben, dies ist auf eine erschreckende Art ans Licht getreten bei einer Gelegenheit, da man es nicht erwarten sollte, nämlich in den Verhandlungen der evangelischen Synode Württembergs im November 1875 über das Reichszivilehegesetz und über die Stellung, welche die evangelische Kirche gegen dasselbe einzunehmen hat. Stadtpfarrer Rieger von Stuttgart hatte den richtigen Antrag gestellt, zu beschließen: „Zulässig (zur kirchlichen Verkündigung und Trauung) sind diejenigen nach dem Reichsgesetz statthaften Ehen, welche nicht mit dem Wort Gottes in Widerspruch stehen und der evangelischen Gemeinde kein Ärgernis geben. Das Nähere darüber festzustellen bleibt einer besonderen kirchlichen Eheordnung vorbehalten.” Es genügt hier anzuführen, dass dieser Antrag, und mit demselben jede Hinweisung auf Gottes Wort, verworfen wurde.\parDer Abfall von der Heiligen Schrift und den Grundsätzen der Reformatoren, der hier zum Vorschein kommt, greift noch tiefer und verbreitet sich noch weiter als nur über das Gebiet des Eherechtes. Wie wird in der modernen Theologie, wenn es sich um Feststellung der Glaubens- und Sittenlehre handelt, die Bibel betrachtet? Nicht als die unverbrüchliche, von Gott gegebene Richtschnur, der wir uns zu unterwerfen haben; sie gilt nur noch als ein Magazin von „Ideen” zur beliebigen Auswahl und Verwendung.\parDie theologische Tätigkeit besteht darin, dass jeder sich von diesen Ideen aneignet, was ihm zusagt, mit Hintansetzung alles dessen, das ihm nicht gefällt, und sich wie aus einem gefügigen Ton ein System zurechtknetet. Man nennt allenfalls die Bibel noch eine „Direktive” die aber nichts dirigiert; eine „Norm” - nach der sich niemand zu richten braucht. Solche Verwüstungen hat auf dem heiligen Boden der Christenheit eine Weltanschauung angerichtet, die nichts mehr wissen will von unverbrüchlichen Geboten Gottes, nichts von der Rechenschaft, die ein jeder vor dem Richterstuhl Christi wird ablegen müssen. Gegen diese falsche Theologie will ich mit der Hilfe Gottes protestieren bis zum letzten Atemzug. Solches war und ist mein Verlangen auch bei der Herausgabe dieser Schrift. Sie sei eine Mahnung an die Gebote des Herrn, nach denen wir alle, die einzelnen wie die Kirchenverwaltungen, unser Urteil empfangen werden, wenn Er kommt.\parBasel, den 14. Dezember 1877\parDer Verfasser
