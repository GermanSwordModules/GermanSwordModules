Description=Rubanowitsch Israel Johannes: Rubanowitsch, Israel Johannes – Zehn Evangelisationsreden über verschiedene Beter
About=Quelle: lesekammer.de (https://lesekammer.de/2026/04/27/rubanowitsch-israel-johannes-zehn-evangelisationsreden-ueber-verschiedene-beter/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parZehn Evangelisationsreden über Verschiedene Beter\parGehalten in Langnau vom 7. bis 14. Februar 1897\parvon Johannes Rubanowitsch Prediger\parNachgeschrieben und herausgegeben von einigen Freunden.\parLangnau 1897. Verlag von Johannes Kipfer, Expedition des „Zionspilgers“.\parSämtliche Texte sind der Glaubensstimme, Stand: Februar 2026, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\parDie Texte sind oft sprachlich bearbeitet und der aktuellen Rechtschreibung angepasst.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen in jeder Art und Weise - entgeltlich oder kostenlos - weitergegeben werden. Ein Link bzw. ein Belegexemplar wäre nett, ist jedoch keine Bedingung.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIch stimme nicht mit allem überein, was die hier veröffentlichten Autoren geschrieben haben – doch möchte ich meine Erkenntnis auch nicht absolut setzen. Darum habe ich auch Schriften aufgenommen, die meiner Erkenntnis widersprechen, so weit es sich nicht um klare Irrlehren geht.\parDie hier publizierten Texte wurden teilweise bereits in der Lesekammer zwischen 2016 und 2025 veröffentlicht – sie wurden dann oft von mir sprachlich (jedoch nicht inhaltlich) überarbeitet. Doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern oder wie auch immer. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\parDie hier folgenden Vorträge sind auf zahlreichen Wunsch stenographiert und im „Zionspilger“ veröffentlicht worden. Wir erfüllen eine Pflicht der Dankbarkeit, wenn wir sie als Broschüre einem größeren Leserkreise zugänglich machen. Tief durchdacht, auf Entscheidung dringend und dennoch recht populär und anziehend, waren dieselben geeignet, einer großen Zuhörerschaft zum reichen Segen zu werden.\parDie Verantwortlichkeit für die Vorträge und ihren Inhalt übernehmen selbstverständlich die Herausgeber, da wir dem lieben Bruder Rubanowitsch die mit vieler Mühe verbundene Durchsicht nicht aufbürden konnten und wollten. Wir glaubten dies umso eher tun zu können, da wir bei jedem einzelnen Vortrag persönlich zugegen waren. Doch möchten wir betonen, dass eine absolut wörtliche Wiedergabe nicht immer möglich war.\parDer lieben Schwester Hanna Keller sei für ihre Bemühungen auch hier nochmals der herzlichste Dank ausgesprochen.\parUnd so möge denn das Heftchen hinausziehen im Namen und zur Ehre dessen, der ein „Gebetserhörer“ ist. Langnau, im Sommer 1897.\parDie Herausgeber.
