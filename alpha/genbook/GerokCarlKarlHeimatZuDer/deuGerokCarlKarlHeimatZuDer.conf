About=Quelle: lesekammer.de (https://lesekammer.de/2024/01/14/karl-von-gerok-buecher-2024/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: Januar 2024, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIch stimme nicht mit allem überein, was die hier veröffentlichten Autoren geschrieben haben – doch möchte ich meine Erkenntnis auch nicht absolut setzen. Darum habe ich auch Schriften veröffentlicht, die meiner Erkenntnis widersprechen, so weit es sich nicht um klare Irrlehren geht.\parDie hier veröffentlichten Texte sind zum Teil von mir sprachlich (jedoch nicht inhaltlich) überarbeitet – doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\parAls Karl Gerok im Jahr 1887 noch einen Jahrgang Evangelienpredigten herausgab, benannte er den Band: „Brosamen“ - auch deswegen, weil es wohl das letzte sei, was er derart biete. Nun aber sind mehrfache Wünsche laut geworden, es möchte doch noch ein Jahrgang von Predigten aus der reichen Fülle des vorhandenen Stoffes zusammengestellt werden. Zwar sind es dieselben zwei Jahrgänge der württembergischen Perikopen, über welche Karl Gerok immer wieder zu predigen hatte; es ist auch die der Gemeinde aus den früheren Sammlungen bekannte Auffassung des Christentums dieselbe geblieben, so dass die Predigt aufs Adventfest als eine Art Programm für diesen Band gelten kann. Für einzelne wenige Sonntage (4) wurde auf Predigten aus den siebziger Jahren zurückgegriffen; Erscheinungs- und Himmelfahrtsfest wurden übergangen, weil Karl Gerok seit 1868 an diesen Tagen nicht mehr zu predigen hatte; von Predigten bei besonderen Anlässen sind nur wenige eingefügt, teils um das Buch nicht allzu umfangreich werden zu lassen, teils weil inzwischen ein eigener Band Kasualreden („Trost und Weihe“, Stuttgart, Carl Krabbe 1890) erschienen ist. Die meisten der hier gedruckten Predigten aber entstammen den drei letzten Lebens- und Amtsjahren und lassen wohl alle etwas von der lichten Klarheit und schlichten Einfachheit, welche den drei letzten, hier auch eingereihten Predigten nachgerühmt wurde, erkennen.\par„Der Heimat zu“ ging es für den greisen und doch noch jugendfrischen Prediger, als er diese Zeugnisse vor seiner irdischen Gemeinde ablegte; möchte es ihnen auch jetzt vergönnt sein, manchem in Unruhe, Lärm und Streit dieser Zeit ein Ruf zu werden: „Der Heimat zu!“\parStuttgart, auf Pfingsten 1893\parDer Herausgeber: G. Gerok
