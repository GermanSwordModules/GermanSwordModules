Description=Ahlfeldt Friedrich: Ahlfeld, Friedrich – Trost und Mahnung in den Tagen der Cholera (überarbeitete Fassung)
About=Quelle: lesekammer.de (https://lesekammer.de/2024/08/03/ahlfeld-friedrich-trost-und-mahnung-in-den-tagen-der-cholera/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: Januar 2024, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____–-____–-____–-____–-____–-____–-____–-\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIch stimme nicht mit allem überein, was die hier veröffentlichten Autoren geschrieben haben – doch möchte ich meine Erkenntnis auch nicht absolut setzen. Darum habe ich auch Schriften veröffentlicht, die meiner Erkenntnis widersprechen, so weit es sich nicht um klare Irrlehren geht.\parDie hier veröffentlichten Texte sind zum Teil von mir sprachlich (jedoch nicht inhaltlich) überarbeitet – doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\parSo geht denn hin, ihr Kinder des schweren Monats. Sagt der Gemeinde noch einmal: „Gott hat uns gezüchtigt, dass wir verleugnen sollen alles ungöttliche Wesen.“ Er hat uns mit Seilen der Liebe an sich gezogen. Ja wenn sie auch in Leib, Seele und Geist eingeschnitten haben, als er zog, wenn wir auch die Wunden und Narben noch jahrelang fühlen werden, es sind doch Seile der Liebe gewesen. Er hat uns damit an und in sich ziehen wollen. Er hat uns lange genug umschlungen mit den weichen Bändern seiner Güte. Die haben wir verachtet und durchgerissen. Darum hat er und anders, schärfer angefasst. - So gehet denn hin, und erinnert die Erretteten noch einmal an die Gebete und an die Gelübde, die sie in den schweren Stunden dem Herrn dargebracht haben. Und wenn die alte Sicherheit wieder einreißt, Gott und sein lieber Sohn wieder vergessen wird, die Gebetsstraße öde steht, und die Sünde wieder vollustig dahinfluten will wie vor der Trübsalsdürre, dann kommt solchen Leichtfertigen noch einmal in die Hände und fraget sie: Wo sind deine Gelübde? Ist Dein Glaube mit verflogen, als der Krankheitsstoff aus unserer Stadt wich? - O des armen Glaubens, der seinen Gott und Heiland nur wohnen weiß, so lange ihm die Zuchtrute auf dem Nacken liegt.
