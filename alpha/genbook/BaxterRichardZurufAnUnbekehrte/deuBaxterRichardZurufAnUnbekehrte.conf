About=Quelle: lesekammer.de (https://lesekammer.de/2023/05/31/richard-baxter-buecher-2023/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme entnommen. Hier sind zumeist auch die Quellangaben zu finden.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\parDiese Bücher sind nicht für den Verkauf, sondern für die kostenlose Weitergabe gedacht. Es kommt jedoch immer wieder zu Fragen, ob und wie man die Arbeit der Glaubensstimme finanziell unterstützen kann. Glücklicherweise bin ich in der Situation, dass ich durch meine Arbeit finanziell unabhängig bin. Daher bitte ich darum, Spenden an die Deutsche Missionsgesellschaft zu senden. Wenn Ihr mir noch einen persönlichen Gefallen tun wollt, schreibt als Verwendungszweck „Arbeit Gerald Haupt“ dabei – Gerald ist ein Schulkamerad von mir gewesen und arbeitet als Missionar in Spanien.\parSpendenkonto: IBAN: DE02 6729 2200 0000 2692 04, BIC: GENODE61WIE\parAlternativ bitte ich darum, die Arbeit der Landeskirchlichen Gemeinschaft Schlossplatz 9 in Schwetzingen zu unterstützen. Die Landeskirchliche Gemeinschaft „Schlossplatz 9 in Schwetzingen ist eine evangelische Gemeinde und gehört zum Südwestdeutschen Gemeinschaftsverband e. V. (SGV) mit Sitz in Neustadt/Weinstraße. Der SGV ist ein freies Werk innerhalb der Evangelischen Landeskirche. Ich gehöre dieser Gemeinschaft nicht selber an, und es gibt auch keinen Zusammenhang zwischen der Gemeinde und der Glaubensstimme, doch weiß ich mich ihr im selben Glauben verbunden.\parLANDESKIRCHLICHE GEMEINSCHAFT „SCHLOSSPLATZ 9“ 68723 SCHWETZINGEN\parGemeinschaftspastor: M. Störmer, Mannheimer Str. 76, 68723 Schwetzingen,\parIBAN: DE62 5206 0410 0007 0022 89 Evangelische Bank eG, Kassel\parAndreas Janssen Im Kreuzgewann 4 69181 Leimen\parNatürlich suche ich immer noch Leute, die Zeit und Lust haben, mitzuarbeiten - wer also Interesse hat, melde sich bitte. Meine Email-Adresse ist: webmaster@glaubensstimme.de. Insbesondere suche ich Leute, die Texte abschreiben möchten, bestehende Texte korrigieren oder sprachlich überarbeiten möchten oder die Programmierkenntnisse haben und das Design der Glaubensstimme verschönern können.\par\parVorwort (lesekammer.de):\parWieder einmal ging ein Jahr vorüber, und wir befinden uns im Jahr 2021 – nach einem sehr chaotischen Jahr geht es weiter.\parDieses Jahr hat uns allen eine Menge abverlangt – doch Gott hat uns hindurchgetragen.\parFür mich persönlich bot die Zeit, die ich gewonnen habe, die Gelegenheit, einige neue Bücher zu erstellen. Gleichzeitig überarbeite ich viele der alten Bücher, sei es, um Fehler zu beheben oder neue Inhalte hinzuzufügen.\parVielleicht hat aber auch der eine oder die andere Lust, mitzumachen und neue Bücher zu erstellen – sprecht mich einfach an.\parEuch allen wünsche ich Gottes reichen Segen und dass Ihr für Euch interessante Texte hier findet. Für Anregungen bin ich immer dankbar.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\paran alle Ungeheiligten, die dieß Buch lesen wollen, insbesondere an die Mitglieder meiner Gemeine zu Kidderminster.\parIhr Männer, liebe Brüder!\parDer ewige Gott, welcher Euch für ein ewiges Leben geschaffen, und Euch durch seinen Sohn erlöst hat, als Ihr jenes und Euch selbst verloren hattet, gedachte Eurer in Eurer Sünde und Eurem Elende: darum gab Er das Evangelium, versiegelte es durch Seinen Geist, und befahl Seinen Dienern, es der Welt zu predigen, damit Er, nachdem Vergebung Euch frei angeboten und der Himmel Euch geöffnet worden ist, Euch von Euren fleischlichen Vergnügungen, von dem Gehorsam gegen diese trügerische Welt zurückzurufen, und Euch mit dem Leben, für das Ihr geschaffen und wiedererkauft seid, bekannt machen könnet, ehe Ihr todt und aller Hülfe unzugänglich seid. Nicht Propheten oder Apostel sandte Er Euch, die ihre Botschaft durch unmittelbare Offenbarung erhalten; sondern Er berief Euch durch Seine ordentlichen Diener, die Er beauftragt hat, dasselbe Evangelium zu predigen, welches Christus und Seine Apostel zuerst verkündigten. Der Herr sah, wie Ihr Ihn und Euer letztes Ende vergesst, wie gering Ihr das Ewige achtet, als Menschen, die nicht wissen, was sie zu thun, oder einst zu leiden haben. Er sah, wie Ihr kühn in der Sünde ohne Furcht vor Seinen Drohungen, ohne Sorge für Eure Seelen seid; Er sah in Eurem Munde den Glauben der Christen, in Eurem Leben die Werke der Ungläubigen. Er sah den furchtbaren Tag in drohender Nähe, an welchem Eure Sorgen anfangen werden und Ihr mit vergeblichem Geschrei, in Qual und Verzweiflung all das beklagen müsst! dann wird die Erinnerung an Eure Thorheit Eure Herzen zerreißen, wenn nicht aufrichtige Bekehrung dem zuvorkömmt. Aus Mitleid mit Euren sündigen unglücklichen Seelen hat der Herr, der besser als Ihr Eure Lage kennt, es uns zur Pflicht gemacht, zu Euch in Seinem Namen zu sprechen, (2. Cor. 5,19;) Euch Eure Sünde und Euer Elend klar zu schildern und was Euer Ende sein wird, und welche traurige Veränderung Ihr bald sehn werdet, wenn Ihr noch etwas länger so dahin geht. Nachdem Er Euch um so theuren Preis, um das Blut Seines Sohnes Jesu Christi, erkauft, nachdem Er Euch Vergebung, Gnade und ewige Herrlichkeit so frei und reichlich angeboten hat, befahl Er uns, alles das, als Gottes Gabe, Euch vorzuhalten, und Euch zu bitten, doch die Nothwendigkeit und den Werth des Dargebotenen zu bedenken. Er sah und bemitleidete Euch, während Ihr in weltlichen Sorgen versunken seid, eifrig kindischen Spielen nachjagt, und die kurze und kostbare Zeit, in welcher Ihr Euch für ein ewiges Leben vorbereiten solltet, in Nichtigkeiten vergeudet: darum hat er uns befohlen, Euch nachzurufen, und Euch zu erzählen, wie Eure Mühe umsonst ist, und Ihr Gefahr lauft, auch Eure Seelen zu verlieren, und wie viel größere und bessere Dinge Ihr sicher haben könnt, wenn Ihr nur auf Seinen Ruf hören wollt ( Jes. 55,1 .2.3.). Wir glauben und gehorchen der Stimme Gottes, und kommen zu Euch in Seinem Auftrage, der uns befiehlt, zu predigen und in Euch zu dringen zur Zeit und zur Unzeit, unsre Stimme zu erheben wie eine Posaune, und Euch Eure Uebertretungen und Sünden zu zeigen. ( Jes. 58,1 .2. 2. Tim. 4,1 .2.). Aber ach! Uns zum Kummer und Euch zum Verderben verstopft Ihr das Ohr, verhärtet den Nacken, verstockt das Herz, und schickt uns zu Gott zurück, um Ihm mit Seufzen zu erzählen, daß wir Seine Botschaft ausgerichtet haben, aber Euch nichts Gutes erweisen, ja kaum Gehör erlangen konnten. O, daß unsre Augen ein Thränenquell wären, unser unwissend sorglos Volk zu beklagen, dem Christus und Vergebung und Leben und der Himmel angeboten wird, und das die Gabe nicht zu würdigen vermag; das Christum und Gnade und Herrlichkeit haben könnte, so gut wie andre, und sie muthwillig vernachlässigt und verachtet! Möchte der Herr unser Herz mit tieferem Mitleid über diese unglücklichen Seelen füllen, daß wir uns ihnen zu Füßen würfen, und ihnen in die Häuser nachgingen und mit bittern Thränen zu ihnen sprächen. Denn lange haben wir ihrer vielen umsonst gepredigt; wir strengen uns an, ihnen verständlich zu werden, und viele wollen uns nicht verstehn; wir suchen ernste eindringliche Worte, die sie fühlen möchten, aber sie wollen nicht fühlen. Wenn das Größeste auf sie wirkte, könnten wir sie erwecken; wenn das Süßeste auf sie wirkte, würden wir sie anlocken und ihr Herz gewinnen; wenn das Furchtbarste auf sie wirkte, würden wir sie wenigstens aus ihrer Sündhaftigkeit aufschrecken; wenn Wahrheit und Gewißheit bei ihnen gölte, könnten wir sie bald überzeugen; wenn der Gott der sie geschaffen, der Heiland der sie erkauft hat, gehört würde, es würde bald anders mit ihnen werden; wenn die Schrift gehört würde, würden wir bald siegen; wenn Gründe, nur die besten und stärksten, gehört würden, würden wir sie ohne Zweifel bald überzeugen; wenn Erfahrung, ihre eigne und die der ganzen Welt, gehört würde, ließe sich die Sache verbessern; ja, wenn ihr Gewissen in ihnen gehört würde, es stände besser mit ihnen. Wenn aber nichts Gehör findet, was sollen wir für sie thun? Wenn der furchtbare Gott im Himmel gering geachtet wird, wer soll beachtet werden? Wenn die unschätzbare Liebe und das Blut eines Erlösers verschmäht wird, was soll geschätzt werden? Wenn des Himmels Herrlichkeit sie nicht reizt, und ewige Freude nichts werth ist, wenn sie über die Hölle scherzen und über dem bodenlosen Abgrunde tanzen und mit dem verzehrenden Feuer spielen können, obgleich Gott und Menschen sie davor warnen, was sollen wir da für solche Seelen thun?\parNoch einmal, in Namen des allmächtigen Gottes, will ich die Botschaft, die Er uns an Euch aufgetragen hat, Euch ausrichten; diesen bleibenden Zeilen will ich sie übergeben, daß sie Euch bekehre oder verdamme, daß sie Euch umwandle, oder im Gerichte gegen Euch aufstehe, und Euch in’s Angesicht bezeuge, daß einmal der ernste Ruf an Euch ergangen ist. Hört es, Ihr Sklaven der Welt, Ihr Knechte des Fleisches und des Satans! Die Ihr Euer Leben lang nach irdischem Glücke ausschaut, und Euer Gewissen in Trunk und Schwelgerei und Faulheit und thörichter Lust untergehen lasst, die Ihr Eure Sünde kennt, und doch fortsündigt, als wolltet Ihr Gott herausfordern, doch einmal schonungslos das Aergste gegen Euch zu versuchen! Hört es alle, die Ihr an Gott nicht denkt, für das Heilige keinen Sinn habt, und an des Herrn Wort und Evangelium, oder an dem Gedanken und der Predigt des ewigen Lebens keinen Geschmack findet; die Ihr um Eure unsterblichen Seelen unbekümmert seid, und nie eine Stunde daran wenden wollt, zu bedenken, ob sie geheiligt oder ungeheiligt sind, und ob Ihr bereit seid, vor dem Herrn zu erscheinen! Hört es alle, die Ihr durch Euer öffentliches Sündigen Euch in den Unglauben hineingesündigt habt, und dem Worte Gottes nicht glaubt! Wer ein Ohr hat, zu hören, der höre den gnädigen und doch furchtbaren Ruf Gottes! Sein Auge ist beständig über Euch; all Eure Sünden sind verzeichnet, und sicherlich sollt Ihr noch einst davon hören! Jetzt führt Gott das Schuldbuch; Er wird es aber mit Seinen Schrecken auf Eure Gewissen schreiben, und dann werdet Ihr selbst es führen! O Ihr Sünder, wüßtet Ihr doch, was Ihr thut, und wen Ihr fortwährend beleidigt! Die Sonne selbst ist Finsterniß gegen den Glanz der Majestät, die Ihr täglich trotzig und leichtsinnig herausfordert. Die sündigen Engel mochten nicht vor Ihm bestehn, sondern wurden in die Qual hinabgestoßen zu den Teufeln; und Ihr Würmer des Staubes wollt Euch so sorglos gegen Euren Schöpfer auflehnen? Wüßtet Ihr nur einen Augenblick, wie es der unglücklichen Seele ergeht, die den lebendigen Gott gegen sich hat! Das Wort seines Mundes, das Dich geschaffen hat, kann Dich vernichten; das Runzeln Seiner Stirn wirft Dich hinaus in die äußerste Finsterniß. Wie begierig sind die Teufel nach Dir, die Dich verführt haben; nur auf das Wort Gottes harren sie, um Dich zu ergreifen und Dich als den ihrigen zu behandeln, und dann wirst Du augenblicklich in der Hölle sein. Ist Gott wider Dich, so ist alles wider Dich; die Welt, die Du so liebtest, ist nur ein Gefängniß für Dich; Du wirst nur darin bewahrt auf den Tag des Grimms; ( Hiob 21,30 .) der Richter kommt, ja Deine Seele geht Ihm entgegen. Ueber ein Kleines, und Deine Freunde sagen von Dir: er ist todt; dann wirst Du das sehen, was Du jetzt verachtest, und fühlen, was Du jetzt nicht glauben willst. Der Tod wird Dir Gründe vorbringen, denen Du nicht antworten kannst; Gründe, die all Deine Einwendungen gegen Gottes Wort und Wege, all Deinen eingebildeten Wahnsinn kräftig widerlegen werden. Wie bald wird sich dann Dein Sinn ändern! Dann sei ungläubig, wenn Du kannst; dann bleib bei Deinen Worten, die Du so gern gegen ein heiliges, himmlisches Leben ausstießest! Dann führe vor Gott die Sache, die Du so oft gegen deine Lehrer und gegen die gottesfürchtigen Leute vertheidigt hast! Dann beharre bei Deinen alten Meinungen, Deiner Geringschätzung des Eifers der Heiligen; Deine stärksten Gründe mache fertig, und dann tritt vor den Richter, und sprich wie ein Mann für Dein fleischliches, ungöttliches, weltliches Leben. Wisse aber, daß Du mit Einem zu rechten hast, den Deine Frechheit nicht verscheucht, den Du nicht so leicht los wirst, als Deine Mitgeschöpfe. Arme Seele! Nur ein dünner Vorhang von Fleisch ist zwischen Dir und dem furchtbaren Anblick, der Dich rasch zum Schweigen bringen und umstimmen und andern Sinnes machen wird. Sobald der Tod den Vorhang weggezogen, siehst Du, was Dich sprachlos macht. Und wie rasch wird Tag und Stunde kommen! Noch ein Paar vergnügte Stunden, noch etliche lustige Gelage noch etwas mehr Ehre und Reichthum der Welt, dann ist Dein Maß voll, Dein Vergnügen zu Ende, dahin alles, darauf Du Dich verließest; von alle dem, dafür Du Heiland und Seligkeit verkauftest, bleibt Dir nur die schwere Rechenschaft. Dem Diebe gleicht Ihr, der lustig in der Schenke das gestohlene Geld durchbringt, während seine Verfolger mit Courierpferden ihm nachsetzen. Während Ihr in Sorgen und weltlichen Vergnügungen versunken, mit Eurer eignen Schmach Euch lustig macht, kommt der Tod mit Courierpferden, Euch zu ergreifen, und Eure Seelen an einen Ort und in einen Zustand zu bringen, von denen Ihr jetzt keine Ahndung habt. Denkt Euch, während Ihr eben frech und eifrig in der Sünde seid, käme ein Bote aus der Hauptstadt, Euch zu ergreifen, und Euer Leben von Euch zu nehmen: auch wenn Ihr ihn nicht sähet, sondern nur wüsstet, daß er kommen soll, würde doch Eure Lust verwelken, Ihr würdet nur an Seine Eile denken, und lauschen, ob er schon an die Thür poche? Sähet Ihr aber nur, wie der Tod eilt, obgleich er Euch noch nicht eingeholt hat! Kein Courier ist rascher, kein Bote sichrer! So gewiß als Ihr des Morgens die Sonne wiederseht, obschon sie viele Tausend Meilen in der Nacht zu machen hat, so gewiß wird der Tod bald bei Euch sein, und wohin ist dann Eure Lust? Wollt Ihr ihn dann wegscherzen oder wegtrotzen? Wollt Ihr dann die höhnen, die Euch warnten? Wer ist dann besser daran, der gläubige Heilige, oder der sinnliche Weltmensch? „Weß wird dann sein, was Ihr zusammengebracht habt?“ ( Luk. 12,19 .20.21.) Bemerkt Ihr dann nicht, daß Tage und Wochen eilig entfliehen, daß Nächte und Morgen schnell kommen und rasch aufeinander folgen? Ihr schlaft, aber Eure Verdammniß schlummert nicht, Ihr säumt, aber „Euer Urtheil ist von lange her nicht säumig,“ ( 2. Petr. 2,3 .4.5.) zu welchem Ihr aufbewahrt werdet zum Peinigen. ( 2. Petr. 2,9 .) „O daß Ihr weise wäret, solches zu vernehmen, und verständet, was Euch hernach begegnen wird!“ (Deut. 32,29.) Wer ein Ohr hat, zu hören, der höre den Ruf Gottes am Tage des Heils!\parO ihr sorglosen Sünder! Kenntet Ihr nur die Liebe, die Ihr undankbar vernachlässigt, die Kostbarkeit des Blutes Christi, das Ihr verachtet! Kenntet Ihr nur, ja kenntet Ihr nur die Schätze des Evangeliums! Kenntet Ihr nur, ja kenntet Ihr nur ein wenig die Gewißheit und Herrlichkeit und Seligkeit des ewigen Lebens, an das Ihr jetzt nicht denken, wonach Ihr nicht zuerst und eifrigst trachten wollt! ( Hebr. 11,6 . 12,28. Matth. 6,13.) Kenntet Ihr nur das ewige Leben mit Gott, welches Ihr vernachlässigt – wie rasch würdet Ihr Eure Sünde wegwerfen, Euren Sinn und Wandel ändern, wie würdet Ihr die Ströme Eurer Neigungen und Eurer Sorgen in eine andere Bahn leiten! Wie entschlossen würdet Ihr die Versuchungen zurückstoßen, die Euch jetzt täuschen und verlocken! Wie eifrig würdet Ihr Euch zu dem seligen Leben bereiten! Wie würdet Ihr ernstlich zu Gott beten, fleißig hören und lernen und forschen, emsig über Seine Gesetze nachdenken! ( Ps. 1,2 .) Wie würdet Ihr Euch fürchten, in Gedanken, Wort oder Werk zu sündigen, wie ängstlich sorgen, Gott zu gefallen und in der Heiligung zu wachsen! Wie andre Leute würdet Ihr sein! Warum aber wollt Ihr dem gewissen Worte Gottes nicht glauben und gehorchen, welches Euch diese ewige Herrlichkeit öffnet?\parJa, lasst Euch sagen, daß Ihr nicht einmal den Unterschied kennt, der schon auf Erden zwischen dem Leben, was Ihr verschmäht, und dem welches Ihr erwählt, statt findet. Die Geheiligten verkehren mit Gott, während Ihr kaum an Ihn zu denken wagt, und nur mit Erde und Fleisch umgeht! Ihr Wandel ist im Himmel, dem Ihr fremd bleibt, weil der Bauch Euer Gott ist. ( Phil. 3,18 .19.20.) Sie suchen das Angesicht Gottes, während Ihr nichts höheres sucht, als was diese Welt bietet. Sie arbeiten für das ewige Leben, da sie den Engeln gleich sein sollen, ( Luk. 20,36 .) während Euch nur Schatten und ein vergängliches Nichts beschäftigen. Wie niedrig ist Euer irdisches, fleischliches, sündiges Leben, im Vergleich mit dem edlen geistigen Leben des wahren Gläubigen. Mit Kummer und Mitleid sah ich oft die Menschen, wie sie für die Welt sich plagen; wie sie Mühe und Arbeit, ja ihr Leben daransetzen für wenig Nahrung und Kleidung, für vergängliche Eitelkeiten und fleischliche Lust und eitle Ehre, als hätten sie an nichts höheres zu denken. Wodurch unterscheiden sich diese von dem Vieh, das arbeitet und frisst und lebt, nur um zu leben? Das innerliche, himmlische Vergnügen, wovon die Gläubigen zehren, schmecken sie nie. Nur ein geringes von dem Trost, den diesen der Vorschmack des himmlischen Erbtheils gewährt, und all ihre Schmach und Leiden dabei, ist mir lieber als all Euer Vergnügen und Euer trügerisches Glück. Nicht um alles, was die Welt für Euch gethan hat, oder was Ihr vernünftiger Weise von ihr erwarten könnt, möchte ich das geringste von Eurer geheimen Gewissensqual, oder einen der schwarzen, furchtbaren Gedanken an Tod und künftiges Leben. Wäre ich in Eurem unbekehrten, fleischlichen Zustande, und wüsste, was ich jetzt weiß, und glaubte, was ich jetzt glaube, mein Leben müsste, dünkt mich, ein Vorschmack der Hölle sein. Wie oft würde ich an die Schrecken des Herrn denken, und an den unglücksvollen Tag, der heraneilt! Der gewisse Tod und die Hölle ständen fortwährend mir vor Augen! Des Tags würde ich an sie denken und Nachts von ihnen träumen; in Furcht würde ich mich niederlegen, in Furcht aufstehn, stets leben in der Furcht, der Tod könnte kommen, ehe ich bekehrt bin. Kein Besitz würde mich glücklich machen, keine Gesellschaft mich erheitern; an nichts hätte ich Freude, so lang ich mich unter Gottes Zorn und Fluch wüßte. Stets würde ich davor zittern, den Ruf zu hören: „Du Narr, diese Nacht soll Deine Seele von Dir genommen werden!“ ( Luk. 22,20 .) Auf mein Gewissen würde der furchtbare Ausspruch geschrieben sein: „Die Gottlosen haben nicht Frieden, spricht der Herr.“ ( Jes. 48,22 . 57,21) Ihr armen Sünder! Ein viel freudigeres Leben könntet Ihr haben, wenn Ihr nur aufrichtig Christo gehorchen und zu Gott kommen wolltet! Dann könntet Ihr kühn zu Gott treten, und Ihn Vater nennen, und mit Leib und Seele Euch Ihm anvertrauen. Dann könntet Ihr von den Verheißungen sagen: Mein sind alle! und vom Fluche: Ich bin frei davon: Les’t Ihr das Gesetz, so könnt Ihr sehen, wovon Ihr errettet seid; les’t Ihr das Evangelium, so könnt Ihr den sehen, der Euch erlöst hat; sehen könnt Ihr Seine Liebe, Sein heiliges Leben und Leiden, wie Er in Versuchungen und Thränen und Blut an dem Werke Eurer Erlösung arbeitet. Den Tod könnt Ihr besiegt und den Himmel offen sehn, und schauen, wie in des Herrn Auferstehung und Verherrlichung Eure Auferstehung und Verherrlichung errungen ist. Blickt Ihr auf die Heiligen, so könnt Ihr sagen: Sie sind meine Brüder und Genossen! Seht Ihr die Unheiligen, so könnt Ihr Euch freuen, daß Ihr aus dem Zustande errettet seid. Schaut Ihr den Himmel, Sonne, Mond und die unzähligen Sterne, so könnt Ihr denken: „Meines Vaters Antlitz ist unendlich herrlicher; viel höher ist, was Er den Heiligen vorbereitet hat; das ist nur der Vorhof des Himmels: die Seligkeit, die ER mir verheißen, ist so viel höher, daß Fleisch und Blut sie nicht sehen können!“ Denkt Ihr an das Grab, so könnt Ihr Euch erinnern, daß „ein verklärter Geist, ein lebendiges Haupt und ein liebender Vater“ in so enger Beziehung zu Eurem Staube stehen, daß er unmöglich vergessen werden kann, daß er vielmehr sichrer auferstehn wird, als im Frühling die Blume; denn es lebt die Seele, des Leibes Wurzel, und Christus lebt, beider Wurzel. Auch an den Tod, den König der Furcht könnt Ihr mit Freude denken, als an den Tag der Befreiung von dem Reste von Sünde und Sorge, den Tag, auf den Ihr hofft und harret, da Ihr die Seligkeit, von der Ihr gehört, schauen und durch die entzückendste Erfahrung lernen sollt, was es heißt, das beste Theil zu wählen, und ein aufrichtig glaubender Heiliger zu werden. Was sagt Ihr? Lebt sich’s nicht vergnügter, der Seligkeit sicher und zum Tode bereit, als wie die Gottlosen, „deren Herz beschwert ist mit Fressen und Saufen, und mit Sorgen der Nahrung, und kommt dieser Tag schnell über sie?“ ( Luk. 21,34 .36.) Hättet Ihr nicht ein bequemes Leben, wenn Ihr einmal Erben des Himmels und der Seligkeit gewiß geworden seid, wenn Ihr diese Welt verlasst? Darum bedenkt wohl was Ihr thut, und werft nicht solche Hoffnungen um nichts und wieder nichts von Euch; Welt und Fleisch kann dergleichen nicht geben!\parUnd abgesehn von allem Elende, daß Ihr über Euch selbst bringt, beunruhigt Ihr auch Andre, so lange Ihr unbekehrt seid. Ihr hindert die Obrigkeit, Euch durch Ihre Gesetze zu regieren; ihr hemmt die Diener des göttlichen Wortes, indem Ihr der Lehre und Zucht, die sie Euch anbieten, widerstrebt, Eure Sünde, Euer Elend macht Ihnen in der Welt die größte Sorge und Unruhe. Ihr verwirrt des Landes Wohl, und zieht Gottes Gerichte auf Euch herab. Ihr am meisten stört den heiligen Frieden und die Ordnung der Kirche, Ihr hindert unsre Einigung und Reinigung, und seid die Schande und Plage der Kirchen, in die Ihr eindringt, der Stellen, die Ihr einnehmt. Herr, wie drückend, wie traurig ist es doch mit uns! Das Evangelium wohnt so reich bei uns, als bei irgend einem Volke, überall hören wir die Lehre, und alle Hülfe die wir wünschen mögen, ist uns zur Hand; als das Schwert uns mähte, und das Gericht wie das Feuer durch das Land lief, da halfst Du uns auf, und so viel wunderbare Gnadenbeweisungen verpflichteten uns Gott und dem Evangelium zu glauben, und heilig zu leben. Und nach alle dem ist Stadt und Land von Unbekehrten überschwemmt, und wohin wir sehen, wuchert die üppigste Sinnlichkeit! Man sollte denken, daß nach so viel Erfahrungen, nach solchen Gerichten und Gnadenbezeugungen Gottes das Volk wie Ein Mann sich versammeln würde, sich zum Herrn zu bekehren; daß es zu seinen frommen Lehrern kommen würde, seine Sünden zu beweinen, und sie öffentlich zu bekennen, und die Vergebung des Herrn zu erflehn; daß es sich für die Zukunft nach Belehrung sehnen und sich freuen würde, innerlich durch den Geist und äußerlich durch die Diener Christi nach Gottes Wort geleitet zu werden. Man sollte denken, daß nach so viel Vernunft- und Schrift-Gründen, als sie gehört, nach so viel Gnade, als sie erfahren haben, kein Ungöttlicher, kein Weltling, kein Trunkenbold, kein Hasser der Bekehrung, kein Feind des Christenthums unter uns gefunden werden würde. Wenn wir auch über einige äußere Gebräuche verschiedner Meinung sind, würden wir uns doch, sollte man glauben, vor allem darüber vereinigen, ein heiliges himmlisches Leben, in Gehorsam gegen Gottes Wort und Diener, und gegenseitiger Liebe und Einigkeit zu führen. Aber ach, wie weit ist unser Volk davon entfernt! Die Meisten streben nur nach irdischen Dingen; sie trachten nicht zuerst nach dem Reiche Gottes und Seiner Gerechtigkeit. Heiligkeit scheint ihnen unnöthig; in ihren Familien ist kein Gebet zu hören, wenn nicht etwa etliche herzlose todte Worte statt täglicher, inbrünstiger Gebete gelten sollen; ihre Kinder werden nicht in der Lehre Christi, im Bunde der Gnade unterwiesen, noch in der Vermahnung zum Herrn erzogen, obschon sie das in der Taufe versprochen haben. Ihre Dienstboten belehren sie nicht über den Weg des Heils; ist ihre Arbeit gethan, so kümmern sie sich weiter nicht um sie. Mehr Schmähreden, als liebliche erbauliche Worte hört man in ihren Familien. Wie wenig sind der Häuser, die den Herrn fürchten, die in Seinem Worte, bei Seinen Dienern forschen, wie sie leben, was sie thun sollen, die sich weisen und leiten lassen, die ernstlich nach dem ewigen Leben ausschauen. Und die wenigen, die Gott so glücklich gemacht hat, sind gewöhnlich der Spott ihrer Nachbarn. Wenn wir sehen, wie Einige im Trunk, andre in Stolz und Weltsinn dahin leben, und die meisten sich wenig um ihr Heil kümmern, obgleich die Sache über allen Zweifel erhaben ist, und wir thun für sie, was wir im Stande sind, werden wir sie meist verlassen, wie wir sie fanden; wenn wir sie aber nach Gottes Gesetz von der Gemeinschaft der Kirche ausschließen, nachdem sie all unsre Ermahnungen hartnäckig verworfen haben, wüthen sie gegen uns, als wären wir ihre Feinde; ihre Herzen sind voll Bosheit gegen uns, und viel lieber empören sie sich gegen den Herrn und sein Gesetz, gegen die Kirche und ihre Diener, als gegen ihre Todsünden. Das ist unser Unglück. Wir haben Obrigkeiten, die die Wege der Gottseligkeit begünstigen, die beste Gelegenheit zur Vereinigung und Besserung wird uns geboten, gläubige Geistliche sehnen sich danach, die Kirche und die Sakramente in der rechten Ordnung zu erhalten; aber die Macht der Sünde im Volke vereitelt fast alles. Auch der gläubige Geistliche kann fast nirgends die unbestreitbar von Christo geforderte Zucht erhalten, oder die anstößigsten, unbußfertigsten Sünder von der Gemeinschaft der Kirche und der Theilnahme an den Sakramenten ausschließen; die meisten schmähen und verunglimpfen ihn, als ob diese unwissenden, sorglosen Seelen weiser als ihre Lehrer, ja als Gott selbst wären! Obgleich also am Tage unserer Heimsuchung, da Gott uns aufruft, Seine Kirche umzugestalten, die Obrigkeiten und die gläubigen Geistlichen willig scheinen, ist doch die Menge des Volks widerwillig, so sehr haben sie sich verblendet und ihre Herzen verstockt, daß sie selbst in diesen Tagen der Erleuchtung und Begnadigung die hartnäckigen Feinde von Licht und Gnade sind, und daß auch Gottes Ruf sie nicht bewegt, ihre Thorheit zu erkennen und einzusehen, was zu ihrem Besten dient! O daß unser Volk zu dieser seiner Zeit bedächte, was zu Seinem Frieden dient, ehe es vor seinen Augen verborgen ist! ( Luk. 19,42 .)\parThörichte, unglückliche Seelen! Wer hat Eure Gemüther zu solchem Wahnsinn, und Eure Herzen zu solcher Erstarrung verzaubert, daß Ihr Euch selbst so tödlich haßt und so starrsinnig in Eure Verdammniß hinein rennt, daß weder das Wort Gottes, noch menschliche Ueberredung Euren Sinn ändern, Eure Hand zurückhalten, Euren Schritt hemmen kann, ehe Ihr unrettbar verloren seid! Bedenkt, Ihr Sünder, daß dies Leben nicht ewig dauert, daß diese Langmuth nicht stets auf Euch wartet. Denkt nicht, daß Ihr ewig ungestraft Eurem Schöpfer und Erlöser trotzen, seinen Feinden dienen, Eure Seele herabwürdigen, die Welt verwirren, die Kirche schänden, die Gottesfürchtigen schmähen, Eure Lehrer bekümmern, die Besserung hindern dürft! Noch wißt Ihr nicht, wie theuer Euch das zu stehen kommen wird; bald aber werdet Ihr es erfahren, wenn der gerechte Gott Euch in Seine Hand nimmt. Denn Er wird anders mit Euch umgehn, als die strengste Obrigkeit, oder als der aufrichtigste Prediger, wenn Ihr nicht den ewigen Qualen durch gründliche Bekehrung und schnellen Gehorsam gegen Gottes Ruf zuvorkommt. Da, wer ein Ohr zu hören hat, der höre, so lange die Gnade noch eine Stimme hat, zu rufen.\parEine Einwendung begegnet mir sehr häufig im Munde der Gottlosen, besonders in den letzten Jahren. Sie sagen: Wir können ohne Gott nichts thun, wir können keine Gnade erlangen, wenn Gott sie uns nicht geben will; und will Er, so werden wir uns rasch bekehren; hat Er uns aber nicht vorher dazu bestimmt, und will er uns nicht bekehren, wie können wir selbst uns bekehren und selig werden? Es liegt nicht an Jemandes Wollen oder Laufen. Und damit halten sie sich für entschuldigt.\parIch habe hierauf ausführlich in diesem Buche geantwortet; vorläufig nur so viel: 1) Wenn Ihr Euch auch nicht selbst heilen könnt, könnt Ihr Euch doch selbst verwunden und vergiften. Gott muß Eure Herzen heiligen, aber wer verdarb sie? Nehmt Ihr muthwillig Gift, weil Ihr Euch nicht selbst heilen könnt? Mich däucht, Ihr solltet Euch desto mehr in Acht nehmen; Ihr solltet Euch desto mehr vor der Sünde hüten, wenn Ihr nicht wieder gut machen könnt, was die Sünde verdorben hat. 2) Obgleich Ihr ohne die besondere Gnade Gottes nicht bekehrt werden könnt, müßt Ihr doch wissen, daß Gott Seine Gnade in dem Gebrauche der dazu bestimmten Gnaden-Mittel gibt; und die allgemeine Gnade setzt Euch in den Stand, der groben Sünde (in äußerlicher That) auszuweichen, und jene Mittel zu gebrauchen. Könnt Ihr in Wahrheit sagen, daß Ihr thut, was in Euren Kräften steht? Könnt Ihr nicht bei der Thüre des Wirtshauses vorbeigehn, oder die Gesellschaft vermeiden, die Euch in der Sünde verhärtet? Seid Ihr nicht im Stande, das Wort zu hören, und das Gehörte zu Hause zu bedenken, und bei Euch selbst über Eure Lage und die ewigen Dinge nachzudenken? Ist es Euch nicht möglich, täglich, oder wenigstens des Sonntags gute Bücher zu lesen, und mit gottesfürchtigen Leuten umzugehn? Ihr könnt nicht sagen, daß Ihr Euer Möglichstes gethan habt. 3) Deshalb wisset, daß Ihr Gottes Gnade und Hülfe durch Eure muthwilligen Sünden und Eure Nachlässigkeit verscherzen könnt, wenn Ihr Euch auch nicht ohne Gnade zu Gott bekehren könnt. Wollt Ihr nicht thun, was Ihr könnt, so hat Gott ja Recht, Euch die Gnade, durch die Ihr mehr thun könntet, zu versagen. 4) Was aber endlich Gottes Rathschlüsse betrifft, so müßt Ihr wissen, daß in ihnen Zweck und Mittel nie getrennt, sondern stets auf’s engste verbunden ist. Gott beschließt nie, Einen selig zu machen, der nicht geheiligt wäre, noch Einen zu verdammen, wenn er nicht unwiedergeboren ist. Gott beschließt eben so sicher, ob Euer Land dürr oder fruchtbar sein soll, und wie lange Ihr in dieser Welt leben sollt, als er beschlossen hat, ob Ihr selig werden sollt, oder nicht, und doch würdet Ihr den für einen Thoren halten, der nicht pflügen oder säen wollte, sondern spräche: „Will Gott, daß mein Acker Korn tragen soll, so wird er es tragen, ich mag nun säen und pflügen, oder nicht. Hat Gott beschlossen, daß ich leben soll, so werde ich leben, ich mag essen oder nicht; hat Er es aber nicht beschlossen, so wird mich auch das Essen nicht am Leben erhalten.“ Wißt Ihr, wie man einem solchen Manne antworten muß, oder wißt Ihr’s nicht? Wißt Ihr’s, dann wißt Ihr auch, was Ihr Euch selbst zu erwidern habt; denn es ist ganz derselbe Fall; Gottes Rathschluß ist eben so unwiderruflich in Beziehung auf den Leib, als in Beziehung auf die Seele. Wißt Ihr’s nicht, dann probiert die Richtigkeit jener Folgerungen erst einmal an Eurem Leibe, ehe Ihr sie auf die Seele anzuwenden wagt; seht erst zu, ob Euch Gott ohne Nahrung und Kleidung am Leben erhalten wird, und ob Er Euch Korn ohne Mühe und Arbeit geben, oder ob Er Euch an das Ziel Eurer Reise ohne Wanderung oder ohne Wagen bringen wird; wenn’s Euch damit glückt, dann mögt Ihr versuchen, ob Er Euch ohne den sorgfältigen Gebrauch der Gnadenmittel in den Himmel bringen wird. Dann mögt Ihr Euch hinsetzen und sagen: „Wir selbst können uns nicht heilig machen.“\parNur dreierlei will ich schließlich von Euch erbitten:\parErstens , daß Ihr dieß kleine Schriftchen aufmerksam durchles’t; und wenn Ihr in Euren Familien solche habt, die dessen bedürfen, daß Ihr es wiederholt mit ihnen durchlest; wenn aber gottesfürchtige Leute zuweilen zu ihren unwissenden Nachbarn gehen, und dieß oder ein anderes Buch über denselben Gegenstand ihnen vorlesen wollten, so könnten sie vielleicht mit dazu helfen, Seelen zu gewinnen. Wenn wir eine so kleine Anstrengung, wie das Durchlesen so kurzer Unterweisungen, von den Menschen nicht erlangen können, wo es sich um ihre Seligkeit handelt, dann wenden sie wahrlich wenig an sich, und werden mit Recht verdammt.\parZweitens : Wenn Ihr das Buch gelesen habt, dann möchte ich Euch bitten, in die Einsamkeit zu gehen und das Gelesen ein wenig zu erwägen, und wie vor dem Angesichte Gottes zu bedenken, ob es nicht wahr ist, und Eure Seelen nahe angeht, und ob es nicht Zeit ist, Euch umzusehn? Und ferner bitte ich Euch, ruft auf Euren Knieen den Herrn an, daß Er Eure Augen öffne, die Wahrheit zu erkennen, daß Er Eure Herzen zu der Liebe Gottes bekehre; erfleht von Ihm all die beseligende Gnade, die Ihr so lang vernachlässigt habt, und lasst nicht ab, von Tage zu Tage, bis Eure Herzen bekehrt sind. Und besonders: geht zu Euren Geistlichen, die über Euch gesetzt sind, um für die Gesundheit und das Heil Eurer Seelen zu sorgen, wie die Aerzte für des Leibes Gesundheit, und laßt Euch von ihnen sagen, welchen Weg Ihr einschlagen sollt; eröffnet ihnen Euren Seelenzustand, damit Ihr die Wohlthat Ihres Rathes und ihrer geistlichen Hülfe genießen könnt. Oder, wenn Ihr keinen gläubigen Seelenhirten in der Gemeinde habt, gebraucht irgend einen andern bei so dringendem Bedürfnisse.\parDrittens : Wenn Ihr durch Lesen, Betrachtung, Gebet und geistlichen Rath einmal Eure Sünde und Elend, Eure Pflicht und die Heilmittel anerkannt habt, dann zaudert nicht; sofort gebt Eure sündige Gesellschaft und Lebensweise auf, bekehrt Euch zu Gott, und gehorcht Seinem Rufe. Wenn Ihr Eure Seelen lieb habt, so nehmt Euch in Acht, einem so lauten Rufe Gottes, ja Eurer eignen bessern Erkenntniß nicht zu widerstreben, daß es Euch nicht am Tage des Gerichtes ärger ergehe, denn Sodom und Gomorrha. Fragt nach Gott, wie Leute, die gern die Wahrheit wissen, und nicht muthwillig sich selbst betrügen wollen. Forschet täglich in der Schrift, und seht, ob es sich also verhalte. Prüft unparteiisch, was besser ist, auf den Himmel oder auf die Erde zu bauen, Gott oder den Menschen, dem Geiste oder dem Fleische zu folgen, in Heiligkeit oder in Sünde zu leben, prüft, ob Ihr auch nur Einen Augenblick noch mit Sicherheit in Eurem ungeheiligten Stande weilen dürft, und wenn Ihr gefunden habt, welches das Beste ist, dann faßt demgemäß Euren Entschluß, und wählt ohne weiteren Aufhalt. Wenn Ihr Eurer eigenen Seele treu seid, und nicht die ewigen Qualen geradezu liebt, bitte ich Euch um Gotteswillen: folgt diesem vernünftigen Rathe. Wie glücklich würden unsre Städte und Landschaften, wie glücklich würde unser ganzes Volk sein, wenn wir unsre Nachbarn nur bewegen könnten, auf einen so nothwendigen Vorschlag einzugehn! Wie vergnügt würden alle gläubigen Prediger sein, wenn ihre Gemeinden wirklich ein himmlisches heiliges Leben führten; das wäre ja die Einigung, der Friede, das Wohl, der Ruhm unserer Kirchen, das glück unserer Nachbarn, der Trost unserer Seelen. Wie ruhig könnten wir Euch dann Vergebung und Frieden predigen, und die Sakramente als Siegel des Friedens Euch darreichen. Mit welcher Liebe und Freude könnten wir unter Euch leben! Wie zuversichtlich könnten wir an Eurem Sterbelager Eure scheidenden Seelen trösten und ermuthigen! Wie voll Trost könnten wir bei Eurem Begräbniß Euch im Grabe verlassen, in der Gewißheit, Eure Seelen im Himmel zu treffen, und Eure Leiber zu dessen Herrlichkeit auferweckt zu sehn! –\parWenn aber die Mehrzahl unter Euch noch ferner in einem sorglosen, unwissenden, fleischlichen, weltlichen, kurz unheiligen Leben dahin gehen will, und all unsre Sehnsucht und Arbeit Euch nicht von dem Muthwillen zurückhalten kann, mit dem Ihr Euch selbst in die Verdammniß stürzt, dann müssen wir den Herrn nachahmen, der sich an den wenigen Edelsteinen erfreut, an der kleinen Heerde, die das Reich erlangen soll, während die Meisten das Elend ärndten werden, welches sie säeten. Des Ausgezeichneten ist ja stets nur wenig. Die Welt hat nicht viele Sonnen oder Monde, nur ein kleiner Theil der Erde ist Gold und Silber, Fürsten und Edle sind nur ein kleiner Theil der Menschenkinder, und die Zahl der Gelehrten, Weisen oder Verständigen in der Welt ist nicht groß. Und wenn also die Pforte eng ist, und deßhalb nur Wenige die Seligkeit erlangen, so wird doch Gott Seinen Ruhm und Seine Freude an diesen wenigen haben. Und wenn dann der Herr Jesus wird geoffenbart werden vom Himmel, sammt den Engeln Seiner Kraft, und mit Feuerflammen Rache zu geben über die, so Gott nicht erkennen und nicht gehorsam sind dem Evangelium unsres Herrn Jesu Christi; dann wird Er herrlich erscheinen mit Seinen Heiligen, und wunderbar mit all Seinen Gläubigen ( 2. Thess. 1,7-10 .)\parUnd was die Uebrigen betrifft, da Gott der Vater sie zu erschaffen sich herabließ, und da Gott der Sohn es nicht verschmäht hat, die Strafe ihrer Sünden am Kreuze zu tragen, und da Er solche Leiden nicht für vergeblich hielt, obgleich ER wußte, daß sie die Heiligung des Heiligen Geistes verschmähen, und sich unrettbar in’s Verderben stürzen würden, so halten auch wir, Seine Diener, unsre Arbeit nicht ganz für verloren, wenn diese auch nicht zu Gott gebracht werden. ( Jes. 49,4 .)\parLeser, ich bin fertig mit Dir, wenn Du dieß Buch durchgelesen hast; aber die Sünde ist noch nicht fertig mit Dir, auch die nicht, die Du längst vergessen glaubtest, und der Satan ist noch nicht fertig mit Dir, wenn er Dir jetzt auch unsichtbar ist, und Gott ist noch nicht fertig mit Dir, weil Du durchaus noch immer mit der todtbringenden Herrschaft der Sünde zu thun haben willst. Ich habe dieß, Dich zu überzeugen, geschrieben, als einer, der bald in die andre Welt gehen wird, wo die Dinge, von denen ich hier rede, sichtbar sind, und der auch weiß, daß Du ihm gar bald dahin folgen mußt. Wenn Du mich je in Freude vor dem Herrn, der uns erschaffen hat, treffen willst; wenn Du je den ewigen Qualen entgehen willst, die da bereitet sind den beharrlichen Verächtern des Heils, und Allen, die nicht durch den Heiligen Geist geheiligt sind, und die nicht die Gemeinschaft der Heiligen, als Mitglieder der heiligen, allgemeinen christlichen Kirche, lieben; wenn Du je das Angesicht Christi, des Weltrichters, und die Majestät des Vaters in Freude und Ruhe zu schauen, und in die Herrlichkeit aufgenommen zu werden hoffst, wenn Du nackt aus dieser Welt mußt; so bitte ich Dich, so beschwöre ich Dich: Höre und gehorche dem Rufe Gottes; bekehre Dich entschieden, daß Du leben mögest! Willst Du aber nicht, obgleich Du keine andern Gründe dazu hast, als weil Du nicht willst; so lade ich Dich zur Verantwortung vor den Herrn, und fordere Dich auf, dort mir Zeugniß zu geben, daß ich Dich gewarnt habe, und aß Du verdammt wirst, nicht weil Dir ein Ruf zur Bekehrung und zum Leben gefehlt hätte, sondern weil Du ihm nicht glauben und gehorchen wolltest, und das wird dann auch bezeugen müssen\parDein ernstlicher Ermahner\parRichard Baxter.\pard. 11. Decbr. 1657.
