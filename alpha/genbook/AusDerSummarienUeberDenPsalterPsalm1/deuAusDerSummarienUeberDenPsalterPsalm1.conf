About=Quelle: lesekammer.de (https://lesekammer.de/2025/01/04/aus-der-glaubensstimme-summarien-ueber-den-psalter-psalm-1/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: Dezember 2022, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\parFür die Bibelübersetzungen habe ich folgende Quellen benutzt:\parLuther : Der Psalter des Königs und Propheten Davids, verdeutscht von Dr. Martin Luther Mit kurzen Summarien oder Inhalt jedes Psalmen Besonders für Schulen eingerichtet. Philadelphia Gedruckt und zu haben bey Conrad Zentler 1833\parAllioli : Der Psalter Allioli's Uebersetzung Mit Original Zeichnungen von Joseph, Ritter von Führich In Holzschnitt ausgeführt von Kaspar Oertel Verlag von Alphons Dürr in Leipzig 1875\parvan Ess : Die Heiligen Schriften des Alten und Neuen Testamentes übersetzt und herausgegeben von Leander van Ess, der Theologie Doctor. Sulzbach in der Oberpfalz Bayerns; Verlag der J.E. von Seidelschen Buchhandlung, 1859.\parKautzsch : Die Heilige Schrift des Alten Testaments Emit Kautzsch 1896 Akademische Verlagsbuchhandlung von J. C. B. Mohr (Paul Siebeck) Tübingen\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\parSeit mehr als 30 Jahren gibt es nun die Glaubensstimme – seit mehr als 10 Jahren die Lesekammer, in der viele Bücher christlicher Autoren kostenlos heruntergeladen werden können.\parEinige Jahre lang habe ich Bücher zu den jeweiligen Sonntagen im Kirchenjahr erstellt – auch diese Reihe wird es wieder geben.\parHier jedoch möchte ich ein anderes Projekt anfangen, das mir schon seit Jahren vorschwebt – Bücher über die Psalmen. Für jeden Psalm möchte ich ein eigenes Buch anfangen mit Andachten, Predigten, Zitaten und Liedern zum jeweiligen Psalm.\parIch weiß nicht, ob Euch das überhaupt interessiert – falls nicht, könnt Ihr ja einfach darüber hinwegsehen. Falls doch, freue ich mich natürlich, von Euch zu hören.\parDie Texte sind teilweise der aktuellen Rechtschreibung angepasst – nur bei sehr alten Texten aus der Reformationszeit habe ich eine Ausnahme gemacht.\parGenug der Worte – lasst uns beginnen.\parAndreas Janssen
