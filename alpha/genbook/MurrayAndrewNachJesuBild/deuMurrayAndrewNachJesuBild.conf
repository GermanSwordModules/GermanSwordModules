About=Quelle: lesekammer.de (https://lesekammer.de/2024/09/04/murray-andrew-nach-jesu-bild/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: Januar 2024, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\parDie Druckvorlage dieses Buches ist\parNach Jesu Bild\parBetrachtungen über das selige Leben der Umgestaltung in das Ebenbild des Sohnes Gottes.\par„Gleichwie ich, also auch ihr“\parVon Andrew Murray\parAus dem Englischen\parBasel Verlag von C. S. Spittler. 1886\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIch stimme nicht mit allem überein, was die hier veröffentlichten Autoren geschrieben haben – doch möchte ich meine Erkenntnis auch nicht absolut setzen. Darum habe ich auch Schriften veröffentlicht, die meiner Erkenntnis widersprechen, so weit es sich nicht um klare Irrlehren geht.\parDie hier veröffentlichten Texte sind zum Teil von mir sprachlich (jedoch nicht inhaltlich) überarbeitet – doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\parIndem ich diese Betrachtungen über die Person unsers hochgelobten HErrn und über unsere Umgestaltung in sein Bild, hinaussende in die Welt, habe ich nur zwei Bemerkungen voraus zu schicken.\parWas ich zuerst betonen möchte ist, dass niemand sich der Schwierigkeit der Aufgabe, die ich mir gestellt habe, und der mangelhaften Ausführung derselben, mehr bewusst sein kann, als ich selbst. Zweierlei lag mir ob: ich musste das Bild des Sohnes Gottes darstellen, als „der in allen Dingen seinen Brüdern gleich gemacht wurde,“ um durch die Tatsachen seines Menschenlebens zu zeigen, wie wir an Ihm das vollkommene Vorbild dessen haben, was der Vater von uns verlangt. Es war nötig, ein solches Bild von Ihm zu entwerfen, welches alle, die danach trachten, Jesu ähnlich zu werden, mächtig anziehen, ihr Verlangen beleben, ihre Liebe vermehren, ihre Hoffnung und ihren Glauben stärken möchte. Dann musste ich aber auch ein anderes Bild zeichnen, dasjenige des Gläubigen, wie in der Tat Jesu Bild einigermaßen aus ihm wiederstrahlt, und wie er inmitten der Proben und Pflichten des täglichen Lebens es beweist, dass die Umgestaltung in Jesu Bild nicht ein bloßes Ideal, sondern durch die Kraft des Heiligen Geistes eine selige Tatsache ist.\parWie oft und wie tief habe ich es empfunden, wenn ich irgend einen Zug des Wesens unsres HErrn näher ausführen wollte, wie gänzlich unzulänglich menschliche Gedanken und menschliche Worte sind, die Geistesschönheit zu erfassen, oder auszudrücken, wovon uns im besten Fall nur schwache Ahnungen zu teil werden. Und wie oft betrügen uns dabei unsere eigenen Gedanken, wenn sie uns irgend eine menschliche Auffassung dessen in den Sinn prägen, was das Wort offenbart, während uns das helle Auge fehlt, für die geistliche Herrlichkeit Jesu, der da ist der Abglanz der Herrlichkeit des Vaters!\parDie zweite Bemerkung, die ich machen möchte, ist ein Wink darüber, was erforderlich ist, um in der Tat die Herrlichkeit des Bildes zu schauen, in welches wir sollen verwandelt werden. Bei einer Prüfung in einer Kleinkinderschule fiel mir sehr auf, in welcher Weise der Anschauungs-Unterricht den Kleinen erteilt wurde. Es wurde ihnen ein Bild gezeigt, welches sie genau betrachten sollten. Dann mussten sie ihre Augen schließen und sich Zeit nehmen, darüber nachzudenken und sich an alles zu erinnern, was sie gesehen hatten. Hierauf wurde das Bild entfernt und die Kinder mussten nun alles darüber sagen, was sie noch wussten. Dann wurde das Bild noch einmal vorgezeigt und sie sollten nun trachten, ausfindig zu machen, was sie das erste Mal übersehen hatten. So ging es noch eine Zeitlang fort, bis jeglicher Zug des Bildes sich dem Gedächtnis der Kinder eingeprägt hatte. Indem ich das lebhafte Interesse beobachtete, womit die kleinen Augen einmal das Bild betrachteten und dann sich wieder fest schlossen, um sich klarer zu machen und zu behalten, was sie gesehen hatten, da dachte ich, wenn unser Bibellesen mehr einem solchen Anschauungsunterricht ähnlich wäre, so müssten die unsichtbaren, geistigen Wahrheiten, welche uns das Wort vormalt, viel tiefere Wurzeln in unserem inneren Leben schlagen. Wir begnügen uns zu leicht mit den Gedanken, welche die Worte der Bibel in uns hervorrufen, obschon diese nur die äußere Hülle der Wahrheit sind, und wir nehmen uns nicht die Zeit, die tatsächliche geistliche Wahrheit, welche das Wort Gottes enthält, in unsere Herzen sich einwurzeln und gründen zu lassen. Lasst uns daran denken, wenn wir nun das Ebenbild Gottes in Christo, zu welchem wir umgestaltet werden sollen, betrachten. Wenn irgend ein besonderer Zug desselben unsre Gedanken beschäftigt, so wollen wir unsere Augen schließen und unser Herz öffnen; wir wollen um den Beistand des Heiligen Geistes bitten und daran glauben, bis wir unseren hochgelobten Meister wirklich in dem besonderen Lichte sehen, wie Ihn das Wort uns Ihn gezeigt hat und wir für den ganzen Tag einen tiefen und bleibenden Eindruck bekommen von der himmlischen Schönheit Jesu, welche, wie wir wissen, auch in uns zustande kommen soll. Lasst uns unverwandt auf Ihn schauen, lasst uns Ihn anbeten; je mehr wir Ihn sehen werden, wie Er ist, desto ähnlicher müssen wir Ihm werden. Das in dem Menschen Christo Jesu offenbarte Ebenbild Gottes zu betrachten, unser innerstes Wesen diesem Bilde zu öffnen und hinzugeben, damit es Besitz von uns ergreife und in uns lebe und dann hinauszugehen in die Welt und die himmlische Ähnlichkeit wiederstrahlen und in unserem Leben unter unsern Mitmenschen leuchten zu lassen, dazu sind wir erlöst worden, das ist der Zweck unsers Lebens.\parUnd nun befehle ich dieses Buch der gnädigen Hand des HErrn, dessen Herrlichkeit es verkündigen möchte. Er lasse es uns erfahren, dass es keine höhere Seligkeit gibt, als die eines Lebens nach Jesu Bild; Er lehre uns glauben, dass in der Gemeinschaft mit Ihm ein solches Leben für uns erreichbar ist. Und indem wir Tag für Tag seinen Worten lauschen, die uns sein Bild vor die Seele führen, möge ein jedes von uns von Herzen sagen: „O mein Vater! Gleichwie dein geliebter Sohn in dir, mit dir, für dich lebte auf Erden, also möchte ich auch leben. Amen.“\parWellington, Cap der guten Hoffnung.\parAndrew Murray.
