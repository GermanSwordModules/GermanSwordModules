About=Quelle: lesekammer.de (https://lesekammer.de/2026/07/11/pischon-friedrich-august-zeugnisse-der-juenger-jesu-von-ihrem-herrn/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parZeugnisse der Jünger Jesu von ihrem Herrn.\parEine Weihnachtsgabe von\parDr. F. A. Pischon, Königl. Consistorialrathe und Archidiakonen der St. Nikolai- und Klosterkirche.\parBerlin, Druck und Verlag von G. Reimer. 1846.\parSämtliche Texte sind der Glaubensstimme, Stand: Juni 2026, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\parDie Texte sind oft sprachlich bearbeitet und der aktuellen Rechtschreibung angepasst. Lediglich bei den Texten, die vor 1750 veröffentlicht wurden und bei denen ich keine aktuellere Version habe, verzichte ich darauf.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen in jeder Art und Weise - entgeltlich oder kostenlos - weitergegeben werden. Ein Link bzw. ein Belegexemplar wäre nett, ist jedoch keine Bedingung.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIch stimme nicht mit allem überein, was die hier veröffentlichten Autoren geschrieben haben – doch möchte ich meine Erkenntnis auch nicht absolut setzen. Darum habe ich auch Schriften aufgenommen, die meiner Erkenntnis widersprechen, so weit es sich nicht um klare Irrlehren geht.\parDie hier publizierten Texte wurden teilweise bereits in der Lesekammer zwischen 2012 und 2025 veröffentlicht – sie wurden dann oft von mir sprachlich (jedoch nicht inhaltlich) überarbeitet. Doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern oder wie auch immer. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\parDie vorliegenden Predigten sind in der zweiten Hälfte des kirchlich vielfach bewegten Jahres 1845 gehalten und können zugleich ein Zeugnis abgeben, wie der Verfasser in jenen kampfreichen Tagen geglaubt und gepredigt hat. Der unvergängliche Inhalt der Textesworte, welche den Predigten zum Grunde liegen, wird aber für alle Zeiten die Kraft in sich tragen, welche die Seelen zu dem Einen zieht, in welchem allein Leben und Seligkeit zu finden ist.\parDass dieser Predigten so wenige sind, hat in dem besonderen Verhältnis des Verfassers seinen Grund, für welches es ihm wünschenswert war, nur einen kleinen Kreis heiliger Aussprüche zusammenfassen zu dürfen. Die vier Diakonen der Nikolaikirche in Berlin teilen sich nämlich in den Gottesdienst der Klosterkirche, wo diese Predigten gehalten wurden, so, dass jeder sonntäglich abwechselnd die Predigt von 11 bis 12 hält. So kommt es, dass jeder in der kirchlichen Jahreshälfte von Trinitatis bis zum Advent nur sechsmal in jener Kirche predigt und da die eine der Predigten im Jahre 1845, welche den Verfasser traf, die Erntepredigt war, wobei er aus der Reihe der gewählten Betrachtungen herauszugehen sich genötigt sah, blieben diese auf die vorliegenden fünf beschränkt, mit welchen aber auch die Zeugnisse von Christo aus dem Munde der Jünger Jesu, welche mit dem Herrn selbst gewandelt, erschöpft sind.\parMöge denn der reiche Inhalt dieser Bekenntnisse die geringe Zahl der Predigten vergüten und die herrlichen Zeugnisse der Jünger, - welche noch fern stehend von allem Streit der Schulen und aller weltlichen Weisheit nur dem unmittelbaren frommen Gefühle, dem tiefen innigen Glauben ihrer Brust folgend, zu ihm reden, - auch das Bekenntnis aller Leser werden, dass sie jenen großen Aposteln ähnlich von ihm erfüllt und an ihn gekettet freudig die Lebensbahn wandeln können, welche ihnen zugeordnet ist. So weihe ich diese Predigten, da sie in der weihnachtlichen Zeit erscheinen, als eine Weihnachtsgabe dem zu Ehren, welcher durch seine Geburt in Nacht und Tod, Licht und Leben gebracht hat, allen, welche sie gehört haben und denen sie zu Gesicht kommen, und bitte den Herrn, dass er seinen reichen Segen darauf legen und durch sie manches Gemüt zum heiligen Glauben an ihn ziehen und in demselbigen befestigen möge.\parBerlin, den 10. November 1846.\parDr. F. A. Pischon.
