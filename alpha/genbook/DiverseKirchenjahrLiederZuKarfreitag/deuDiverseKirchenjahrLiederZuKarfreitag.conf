About=Quelle: lesekammer.de (https://lesekammer.de/2023/07/10/kirchenjahr-buecher-2023/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: Oktober 2021, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\parBereits vor einigen Jahren gab es in der Lesekammer eine Reihe mit Texten zu den Sonntagen im Kirchenjahr – und in der Glaubensstimme gibt es eine eigene Rubrik dafür.\parMittlerweile ist eine Reihe neues Material dazugekommen – Zeit, eine neue Auflage zu starten.\parWarum eigentlich gibt es das Kirchenjahr – schließlich wird es – mit Ausnahme der beiden Volkskirchen – in den Freikirchen kaum beachtet? Dazu habe ich ein Zitat von Wilhelm Löhe gefunden:\par„ So wie die Sonne alljährlich aufs neue ihren Lauf beginnt und mit ihren Tageskreisen und Veränderungen ihres Aufgangs und Untergangs Zeichen, Zeiten, Tage und Jahre gibt, so geht am geistlichen Himmel der Kirche alltäglich die Erinnerung dessen auf, von dem die Sonne ein glänzendes Bild ist, und die Hauptfeier des kirchlichen Jahres ist nichts anderes als ein immer neues Vorführen, Predigen und Verkündigen des Lebens, Leidens, Sterbens und der Verherrlichung unseres Herrn. Es kann kein menschliches Buch geben, in welchem das feiernde Andenken der Geschichte Jesu so herrlich vorgeführt wird als im Kranz der Feste und Gottesdienste der Kirche Gottes. Wer mit der Kirche lebt und feiert, wird sich durch die jährlich wiederkehrende Reihe von Festen und Tagen und Gottesdiensten tiefer, reicher und erquickender mit der Geschichte des Herrn bekannt machen als durch das Lesen selbst des herrlichsten Buches. Das Kirchenjahr ist wie ein Gewächs, welches auf dem Boden der Kirche allmählich wie von selbst entstanden ist, wie ein Baum, der seine Zweige über alle Tage des Jahres hinbreitet, und von welchem der staunende Betrachter am Ende nicht weiß, ob sich mehr Freiheit oder mehr Gesetz und Regel in ihm ausspricht.“\parVon manchen Autoren sind in den einzelnen Büchern mehrere Texte enthalten; einige Texte sind im originalen Deutsch geblieben, andere habe ich vorsichtig versucht, der aktuellen Rechtschreibung anzupassen – ich hoffe, es gefällt Euch.\parAm Ende jedes Buches findet Ihr – nach den Texten zum jeweiligen Sonntag – noch das Buch „Das christliche Kirchenjahr“ von F. Schönfeld aus dem Jahr 1866. Dieses Buch erklärt kurz das Kirchenjahr mit den einzelnen Kreisen.\parGruß & Segen,\parAndreas\par\parSpendenaufruf (lesekammer.de):
