About=Quelle: lesekammer.de (https://lesekammer.de/2023/10/01/unbekannte-autoren-buecher-2023/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme entnommen. Hier sind zumeist auch die Quellangaben zu finden.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\parDiese Bücher sind nicht für den Verkauf, sondern für die kostenlose Weitergabe gedacht. Es kommt jedoch immer wieder zu Fragen, ob und wie man die Arbeit der Glaubensstimme finanziell unterstützen kann. Glücklicherweise bin ich in der Situation, dass ich durch meine Arbeit finanziell unabhängig bin. Daher bitte ich darum, Spenden an die Deutsche Missionsgesellschaft zu senden. Wenn Ihr mir noch einen persönlichen Gefallen tun wollt, schreibt als Verwendungszweck „Arbeit Gerald Haupt“ dabei – Gerald ist ein Schulkamerad von mir gewesen und arbeitet als Missionar in Spanien.\parSpendenkonto: IBAN: DE02 6729 2200 0000 2692 04, BIC: GENODE61WIE\parAlternativ bitte ich darum, die Arbeit der Landeskirchlichen Gemeinschaft Schlossplatz 9 in Schwetzingen zu unterstützen. Die Landeskirchliche Gemeinschaft „Schlossplatz 9 in Schwetzingen ist eine evangelische Gemeinde und gehört zum Südwestdeutschen Gemeinschaftsverband e. V. (SGV) mit Sitz in Neustadt/Weinstraße. Der SGV ist ein freies Werk innerhalb der Evangelischen Landeskirche. Ich gehöre dieser Gemeinschaft nicht selber an, und es gibt auch keinen Zusammenhang zwischen der Gemeinde und der Glaubensstimme, doch weiß ich mich ihr im selben Glauben verbunden.\parLANDESKIRCHLICHE GEMEINSCHAFT „SCHLOSSPLATZ 9“ 68723 SCHWETZINGEN\parGemeinschaftspastor: M. Störmer, Mannheimer Str. 76, 68723 Schwetzingen,\parIBAN: DE62 5206 0410 0007 0022 89 Evangelische Bank eG, Kassel\parUnd für Sachspenden (alte Bücher, Schokolade, Tee, Kekse ) hier meine Adresse:\parAndreas Janssen Im Kreuzgewann 4 69181 Leimen\parNatürlich suche ich immer noch Leute, die Zeit und Lust haben, mitzuarbeiten - wer also Interesse hat, melde sich bitte. Meine Email-Adresse ist: andreas.janssen@glaubensstimme.de. Insbesondere suche ich Leute, die Texte abschreiben möchten, bestehende Texte korrigieren oder sprachlich überarbeiten möchten oder die Programmierkenntnisse haben und das Design der Glaubensstimme verschönern können.\par\parVorwort (lesekammer.de):\parDie Glaubensstimme gibt es jetzt bald 25 Jahre, und auch die Lesekammer kommt in die Jahre.\parBei der Durchsicht der Texte sind mir immer wieder Tippfehler aufgefallen. Deshalb korrigiere ich seit Oktober 2017 die Texte in der Glaubensstimme. Bei ca. 15.000 Texten ist das eine Menge Zeug, und da ich nebenbei auch noch arbeite, kann ich das nur in meiner Freizeit machen.\parViele dieser Tippfehler (wohlgemerkt, ich spreche nicht von alten Schreibweisen, die ich beibehalten werde, sondern von wirklichen Fehlern) sind auch in die Bücher der Lesekammer eingedrungen. Daher bearbeite ich auch diese Bücher jetzt und werde die alten nach und nach ersetzen.\parGleichzeitig bitte ich in den alten Büchern noch um Spenden für den Berghof Bethanien. Leider hat dieser seine Arbeit Ende 2017 eingestellt. Daher bitte ich ab jetzt die von Euch, die etwas Geld übrig haben, um Spenden für einen ehemaligen Mitschüler von mir, der für die DMG als Missionar in Spanien arbeitet. Genauere Informationen findet Ihr auf der letzten Seite dieser Bücher.\parEuch allen wünsche ich Gottes reichen Segen und dass Ihr für Euch interessante Texte hier findet. Für Anregungen bin ich immer dankbar.\parGruß & Segen,\parAndreas
