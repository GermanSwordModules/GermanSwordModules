Description=Major Charles Forsythe: Major, Charles Forsythe – Das Gesetz Gottes Erklärt in der evangelischen Kapelle zu Straßburg
About=Quelle: lesekammer.de (https://lesekammer.de/2026/03/25/major-charles-forsythe-das-gesetz-gottes-erklaert-in-der-evangelischen-kapelle-zu-strassburg/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parDas Gesetz Gottes Erklärt in der evangelischen Kapelle zu Straßburg\parVon\parC. F. Major, V. D. M.\parDer Ertrag ist zum Besten der Evangelischen Gesellschaft für Frankreich bestimmt.\parLeipzig, Bei Karl Tauchnitz. 1837\parSämtliche Texte sind der Glaubensstimme, Stand: Dezember 2025, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen in jeder Art und Weise - entgeltlich oder kostenlos - weitergegeben werden.\parEs steht nirgend geschrieben: der Buchstabe ist tot, sondern der Buchstabe tötet; um töten zu können, muss er aber lebendig sein.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIch stimme nicht mit allem überein, was die hier veröffentlichten Autoren geschrieben haben – doch möchte ich meine Erkenntnis auch nicht absolut setzen. Darum habe ich auch Schriften aufgenommen, die meiner Erkenntnis widersprechen, so weit es sich nicht um klare Irrlehren geht.\parDie hier publizierten Texte wurden teilweise bereits in der Lesekammer zwischen 2016 und 2025 veröffentlicht – sie wurden dann oft von mir sprachlich (jedoch nicht inhaltlich) überarbeitet. Doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern oder wie auch immer. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas
