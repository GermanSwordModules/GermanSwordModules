About=Quelle: lesekammer.de (https://lesekammer.de/2023/07/27/carl-ferdinand-wilhelm-walther-buecher-2023/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme entnommen. Hier sind zumeist auch die Quellangaben zu finden.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\parDiese Bücher sind nicht für den Verkauf, sondern für die kostenlose Weitergabe gedacht. Es kommt jedoch immer wieder zu Fragen, ob und wie man die Arbeit der Glaubensstimme finanziell unterstützen kann. Glücklicherweise bin ich in der Situation, dass ich durch meine Arbeit finanziell unabhängig bin. Daher bitte ich darum, Spenden an die Deutsche Missionsgesellschaft zu senden. Wenn Ihr mir noch einen persönlichen Gefallen tun wollt, schreibt als Verwendungszweck „Arbeit Gerald Haupt“ dabei – Gerald ist ein Schulkamerad von mir gewesen und arbeitet als Missionar in Spanien.\parSpendenkonto: IBAN: DE02 6729 2200 0000 2692 04, BIC: GENODE61WIE\parAlternativ bitte ich darum, die Arbeit der Landeskirchlichen Gemeinschaft Schlossplatz 9 in Schwetzingen zu unterstützen. Die Landeskirchliche Gemeinschaft „Schlossplatz 9 in Schwetzingen ist eine evangelische Gemeinde und gehört zum Südwestdeutschen Gemeinschaftsverband e. V. (SGV) mit Sitz in Neustadt/Weinstraße. Der SGV ist ein freies Werk innerhalb der Evangelischen Landeskirche. Ich gehöre dieser Gemeinschaft nicht selber an, und es gibt auch keinen Zusammenhang zwischen der Gemeinde und der Glaubensstimme, doch weiß ich mich ihr im selben Glauben verbunden.\parLANDESKIRCHLICHE GEMEINSCHAFT „SCHLOSSPLATZ 9“ 68723 SCHWETZINGEN\parGemeinschaftspastor: M. Störmer, Mannheimer Str. 76, 68723 Schwetzingen,\parIBAN: DE62 5206 0410 0007 0022 89 Evangelische Bank eG, Kassel\parAndreas Janssen Im Kreuzgewann 4 69181 Leimen\parNatürlich suche ich immer noch Leute, die Zeit und Lust haben, mitzuarbeiten - wer also Interesse hat, melde sich bitte. Meine Email-Adresse ist: webmaster@glaubensstimme.de. Insbesondere suche ich Leute, die Texte abschreiben möchten, bestehende Texte korrigieren oder sprachlich überarbeiten möchten oder die Programmierkenntnisse haben und das Design der Glaubensstimme verschönern können.\par\parVorwort (lesekammer.de):\parWieder einmal ging ein Jahr vorüber, und wir befinden uns am Ende des Jahres 2020 – Zeit, einige Bücher noch aufzuarbeiten, die ich Euch anbieten möchte.\parDieses Jahr hat uns allen eine Menge abverlangt – doch Gott hat uns hindurchgetragen.\parFür mich persönlich bot die Zeit, die ich gewonnen habe, die Gelegenheit, einige neue Bücher zu erstellen. Gleichzeitig überarbeite ich viele der alten Bücher, sei es, um Fehler zu beheben oder neue Inhalte hinzuzufügen. Zunächst möchte ich die bestehenden Autorenbücher bearbeiten, danach sollen dann die Bücher zum Kirchenjahr, die Andachtsbücher und 1-2 neue Reihen aktualisiert werden.\parVielleicht hat aber auch der eine oder die andere Lust, mitzumachen und neue Bücher zu erstellen – sprecht mich einfach an.\parEuch allen wünsche ich Gottes reichen Segen und dass Ihr für Euch interessante Texte hier findet. Für Anregungen bin ich immer dankbar.\parGruß & Segen,\parAndreas
