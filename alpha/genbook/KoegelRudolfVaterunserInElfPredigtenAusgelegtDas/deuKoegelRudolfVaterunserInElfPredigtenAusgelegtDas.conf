About=Quelle: lesekammer.de (https://lesekammer.de/2026/07/20/koegel-rudolf-das-vaterunser-in-elf-predigten-ausgelegt/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parDas Vaterunser\parin eilf Predigten ausgelegt durch\parD. th. Rudolf Kögel, Oberhof- und Domprediger, Königlichen Schloßpfarrer zu Berlin und Generalsuperintendenten der Kurmark.\parZweite Auflage.\parBremen, 1881. Verlag von C. Ed. Müller.\parSämtliche Texte sind der Glaubensstimme, Stand: Juni 2026, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\parDie Texte sind oft sprachlich bearbeitet und der aktuellen Rechtschreibung angepasst. Lediglich bei den Texten, die vor 1750 veröffentlicht wurden und bei denen ich keine aktuellere Version habe, verzichte ich darauf.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen in jeder Art und Weise - entgeltlich oder kostenlos - weitergegeben werden. Ein Link bzw. ein Belegexemplar wäre nett, ist jedoch keine Bedingung.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIch stimme nicht mit allem überein, was die hier veröffentlichten Autoren geschrieben haben – doch möchte ich meine Erkenntnis auch nicht absolut setzen. Darum habe ich auch Schriften aufgenommen, die meiner Erkenntnis widersprechen, so weit es sich nicht um klare Irrlehren geht.\parDie hier publizierten Texte wurden teilweise bereits in der Lesekammer zwischen 2012 und 2025 veröffentlicht – sie wurden dann oft von mir sprachlich (jedoch nicht inhaltlich) überarbeitet. Doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern oder wie auch immer. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas
