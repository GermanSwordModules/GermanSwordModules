About=Quelle: lesekammer.de (https://lesekammer.de/2023/07/24/waldenser-buecher-2023/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: August 2022, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\par2023 – und ich mache weiter damit, neue Bücher zusammenzustellen in der Hoffnung, dass in ihnen etwas ist, was Euch in Eurem Glauben weiterbringt.\parDabei werden zum Teil alte Bücher überarbeitet, neue angeboten oder thematische erstellt, zum Beispiel für die christlichen Feiertage.\parEuch allen wünsche ich Gottes reichen Segen und dass Ihr für Euch interessante Texte hier findet. Für Anregungen bin ich immer dankbar.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\parDer auf den nachfolgenden Blättern gegebene Überblick der Geschichte der Waldenser (oder, wie ihr Name seinem Ursprunge nach eigentlich geschrieben werden sollte, Valdesier) gibt im Wesentlichen einen Vortrag wieder, den der Herr Verfasser, Professor Dr. F. Nielsen unter uns besonders durch seine interessante Schrift: „Das Papsttum im 19. Jahrhundert“ (deutsche Ausgabe: Gotha, Friedr. Andr. Perthes, 2. Aufl. 1880) rühmlichst bekannt im November vorigen Jahres in Kopenhagen gehalten hat, und zwar in einer der Versammlungen, welche seit mehreren Jahren der dortige „Verein für populäre kirchen- und missionsgeschichtliche Vorträge“ unter lebhafter Teilnahme der Gebildeten zu veranstalten pflegt. Die kleine Schrift ist (Kopenhagen 1880) zu dem Zweck veröffentlicht, das Interesse an dem hoffnungsreichen Evangelisationswerke der Waldenser in weiteren Kreisen anzuregen und zu beleben, nachdem für die Förderung dieses Zwecks in Dänemark sich ein aus angesehenen Männern bestehendes Komitee gebildet hat. Auch in Deutschland wird hoffentlich das von geschickter Hand gezeichnete geschichtliche Bild manchen geneigt machen, der Sache seine Teilnahme zuzuwenden, oder dazu dienen, ihn in dieser Teilnahme zu bestärken.\parA. M.\par\parSpendenaufruf (lesekammer.de):
