About=Quelle: lesekammer.de (https://lesekammer.de/2023/07/20/goebel-karl/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parStephanus, der Prediger des Gottes der Gerechtigkeit Nebst einer Zugabe von einigen Homilien über verwandte alttestamentliche Stellen.\parvon\parKarl Göbel, ev. reformirten Pastor in Erlangen\parErlangen, Verlag von Theodor Bläsing 1863\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\par2023 – und ich mache weiter damit, neue Bücher zusammenzustellen in der Hoffnung, dass in ihnen etwas ist, was Euch in Eurem Glauben weiterbringt.\parDabei werden zum Teil alte Bücher überarbeitet, neue angeboten oder thematische erstellt, zum Beispiel für die christlichen Feiertage.\parEuch allen wünsche ich Gottes reichen Segen und dass Ihr für Euch interessante Texte hier findet. Für Anregungen bin ich immer dankbar.\parGruß & Segen,\parAndreas\par\parSpendenaufruf (lesekammer.de):
