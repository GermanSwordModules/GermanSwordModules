About=Quelle: lesekammer.de (https://lesekammer.de/2025/03/26/wuensche-ernst-levin-die-menschwerdung-des-sohnes-gottes/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parDie Menschwerdung des Sohnes Gottes Fünf Predigten, zu Weihnachten und Neujahr gehalten,\parvon\parErnst Levin Wünsche\\, Prediger an der evangelischen Brüdergemeine in Berlin\parBerlin, 1862, Verlag von Küntzel & Beck. Wilhelms-Straße Nr. 115\parSämtliche Texte sind der Glaubensstimme, Stand: Januar 2025, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIch stimme nicht mit allem überein, was die hier veröffentlichten Autoren geschrieben haben – doch möchte ich meine Erkenntnis auch nicht absolut setzen. Darum habe ich auch Schriften veröffentlicht, die meiner Erkenntnis widersprechen, so weit es sich nicht um klare Irrlehren geht.\parDie hier veröffentlichten Texte wurden bereits in der Lesekammer zwischen 2016 und 2023 veröffentlicht – jetzt sind zum Teil von mir sprachlich (jedoch nicht inhaltlich) überarbeitet. Doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern oder wie auch immer. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas
