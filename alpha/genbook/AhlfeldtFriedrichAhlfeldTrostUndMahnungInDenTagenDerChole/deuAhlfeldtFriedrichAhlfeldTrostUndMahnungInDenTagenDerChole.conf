Description=Ahlfeldt Friedrich: Ahlfeld, Friedrich – Trost und Mahnung in den Tagen der Cholera
About=Quelle: lesekammer.de (https://lesekammer.de/2023/05/01/friedrich-ahlfeld-buecher-2023/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: Oktober 2021, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\par2022 – ich fange jetzt (im September 2021) schon an, die Bücher für das nächste Jahr zu überarbeiten. Das bedeutet, dass neue Bücher hinzukommen und bestehende Bücher überarbeitet werden. Und da mittlerweile in der Lesekammer mehr als 1.000 Bücher zum Download stehen, ist das eine Menge Arbeit. Deshalb fange ich so früh wie möglich damit an.\parAn den Büchern, die es schon gibt, ändert sich das Vorwort. Zusätzlich möchte ich Bilder der jeweiligen Autoren hinzufügen, so weit mir diese vorliegen. Und ein neuer Spendenaufruf steht auf der letzten Seite – es geht um die Kirche Jung St. Peter in Straßburg. Wer mich kennt, der weiß, dass ich für die Kirche der Reformationszeit in Straßburg eine ganz besondere Vorliebe habe – daher der Spendenaufruf für die Kirche, in der Capito und Fagio wirkten..\parEuch allen wünsche ich Gottes reichen Segen und dass Ihr für Euch interessante Texte hier findet. Für Anregungen bin ich immer dankbar.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\parSo geht denn hin, ihr Kinder des schweren Monats. Sagt der Gemeinde noch einmal: „Gott hat uns gezüchtigt, daß wir verleugnen sollen alles ungöttliche Wesen.“ Er hat uns mit Seilen der Liebe an sich gezogen. Ja wenn sie auch in Leib, Seele und Geist eingeschnitten haben, als er zog, wenn wir auch die Wunden und Narben noch jahrelang fühlen werden, es sind doch Seile der Liebe gewesen. Er hat uns damit an und in sich ziehen wollen. Er hat uns lange genug umschlungen mit den weichen Bändern seiner Güte. Die haben wir verachtet und durchgerissen. Darum hat er und anders, schärfer angefaßt. - So gehet denn hin, und erinnert die Erretteten noch einmal an die Gebete und an die Gelübde, die sie in den schweren Stunden dem Herrn dargebracht haben. Und wenn die alte Sicherheit wieder einreißt, Gott und sein lieber Sohn wieder vergessen wird, die Gebetsstraße öde steht, und die Sünde wieder vollustig dahinfluthen will wie vor der Trübsalsdürre, dann kommt solchen Leichtfertigen noch einmal in die Hände und fraget sie: Wo sind deine Gelübde? Ist Dein Glaube mit verflogen, als der Krankheitsstoff aus unserer Stadt wich? - O des armen Glaubens, der seinen Gott und Heiland nur wohnen weiß, so lange ihm die Zuchtruthe auf dem Nacken liegt.\par\parSpendenaufruf (lesekammer.de):
