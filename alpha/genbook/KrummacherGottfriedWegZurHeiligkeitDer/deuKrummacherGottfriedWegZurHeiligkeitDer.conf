Description=Krummacher Gottfried Daniel: Krummacher, Gottfried Daniel – Weg zur Heiligkeit, Der
About=Quelle: lesekammer.de (https://lesekammer.de/2023/07/02/krummacher-gottfried-daniel-buecher-2023/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parVorwort (lesekammer.de):\parWieder einmal ging ein Jahr vorüber, und wir befinden uns am Ende des Jahres 2020 – Zeit, einige Bücher noch aufzuarbeiten, die ich Euch anbieten möchte.\parDieses Jahr hat uns allen eine Menge abverlangt – doch Gott hat uns hindurchgetragen.\parFür mich persönlich bot die Zeit, die ich gewonnen habe, die Gelegenheit, einige neue Bücher zu erstellen. Gleichzeitig überarbeite ich viele der alten Bücher, sei es, um Fehler zu beheben oder neue Inhalte hinzuzufügen. Zunächst möchte ich die bestehenden Autorenbücher bearbeiten, danach sollen dann die Bücher zum Kirchenjahr, die Andachtsbücher und 1-2 neue Reihen aktualisiert werden.\parVielleicht hat aber auch der eine oder die andere Lust, mitzumachen und neue Bücher zu erstellen – sprecht mich einfach an.\parEuch allen wünsche ich Gottes reichen Segen und dass Ihr für Euch interessante Texte hier findet. Für Anregungen bin ich immer dankbar.\parGruß & Segen,\parAndreas
