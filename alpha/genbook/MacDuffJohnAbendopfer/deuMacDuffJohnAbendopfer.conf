About=Quelle: lesekammer.de (https://lesekammer.de/2026/03/28/macduff-john-ross-abendopfer/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parAbendopfer\parvom Verfasser der Schriften: „Er ist treu, der - verheißen hat.“ „Der Bogen in den Wolken“, „Worte Jesu an die Müden“, und „Jesu Sinn“.\parNro. 484.\parHerausgegeben von der Wupperthaler Traktat-Gesellschaft.\parBarmen, 1882. Druck von D. B. u. T. G. Wiemann\parSämtliche Texte sind der Glaubensstimme, Stand: Februar 2026, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\parDie Texte sind oft sprachlich bearbeitet und der aktuellen Rechtschreibung angepasst.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen in jeder Art und Weise - entgeltlich oder kostenlos - weitergegeben werden. Ein Link bzw. ein Belegexemplar wäre nett, ist jedoch keine Bedingung.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIch stimme nicht mit allem überein, was die hier veröffentlichten Autoren geschrieben haben – doch möchte ich meine Erkenntnis auch nicht absolut setzen. Darum habe ich auch Schriften aufgenommen, die meiner Erkenntnis widersprechen, so weit es sich nicht um klare Irrlehren geht.\parDie hier publizierten Texte wurden teilweise bereits in der Lesekammer zwischen 2016 und 2025 veröffentlicht – sie wurden dann oft von mir sprachlich (jedoch nicht inhaltlich) überarbeitet. Doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern oder wie auch immer. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas\par\parVorwort (lesekammer.de):\parDer Verfasser hat auf den nachfolgenden Seiten sich bemüht, den wiederholten Anforderungen zu entsprechen, die an ihn in Betreff einer kleinen Sammlung von Abendgebeten gestellt waren.\parMöge Er, bei dem „die Fülle des Geistes wohnt“, seinen Engel niedersenden, und uns anrühren zur Zeit unseres Abend-Opfers, dass Alles, was unlauter ist in Gedanken und Worten, aufgehe in den Wohlgeruch der Weihrauchwolke, welche von dem goldenen Altar zu dem Gnadenstuhle emporsteigt. Amen.
