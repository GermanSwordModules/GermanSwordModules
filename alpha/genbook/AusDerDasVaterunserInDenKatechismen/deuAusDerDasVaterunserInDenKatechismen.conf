About=Quelle: lesekammer.de (https://lesekammer.de/2025/03/29/aus-der-glaubensstimme-das-vaterunser-in-den-katechismen/). Gemeinfreier historischer Text, Weitergabe laut lesekammer.de ausdruecklich gewuenscht.\par\parQuellen (im Original genannt):\parSämtliche Texte sind der Glaubensstimme, Stand: Januar 2025, und den dazugehörigen Seiten entnommen. Diese Seiten sind:\parAlte Lieder\parBriefe der Reformationszeit\parGebete\parZeugen Christi\parBei vielen, aber nicht bei allen Texten sind auch die Quellen angegeben.\par____----____----____----____----____----____----____----\parDie Bücher der Glaubensstimme werden kostenlos herausgegeben und dürfen kostenlos weitergegeben werden.\par\parVorwort (lesekammer.de):\parIch bin der Meinung, es sei an der Zeit, von unseren Vätern und Müttern im Glauben zu lernen, was und wie sie geglaubt haben. Viel Wissen ist im Laufe der Jahrhunderte verloren gegangen, und dafür ist manche Torheit ins Christentum eingeflossen.\parDeshalb gibt es die Glaubensstimme, und deshalb gibt es auch die Bücher, die Ihr hier herunterladen könnt. Manche Autoren sind Euch sicher bekannt, andere eher weniger.\parIn diesem Buch geht es um das Vaterunser in den Katechismen. Manche Leser mögen neben den lutherischen auch noch den Heidelberger Katechismus kennen – doch viele wissen nicht, dass es schon vor und in der Reformationszeit weit über 100 Katechismen oder katechetische Schriften der verschiedenen Konfessionen gab. Ich biete hier lutherische, reformierte, Straßburger, anglikanische und unabhängige Quellen an. Sprachlich wurden Sie nicht angepasst. Sortiert habe ich sie nach dem jeweiligen Autor.\parDie hier veröffentlichten Texte wurden bereits in der Lesekammer zwischen 2003 und 2025 veröffentlicht. Doch sie sind nicht mein Eigentum. Daher dürft Ihr sie in jeder Euch gefallenden Art nutzen – sei es durch Veröffentlichung im Internet, in Zeitungen, in Büchern oder wie auch immer. Ein Belegexemplar oder ein Link wären schön, sind jedoch keine Bedingung.\parGruß & Segen,\parAndreas
