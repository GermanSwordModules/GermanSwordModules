History_1.0=Complete first edition (Bd. I-V, 11581 entries), merged from 5 separately OCR'd volumes; entries scored against the modern RGG4 headword index and alphabetical-order checks, with a manual review pass applied to flagged entries.
History_1.1=First manual review pass applied (298 flagged entries: 201 confirmed, 43 deleted, 109 text-corrected, 87 headwords corrected); 9 entries where a second full article had been wrongly glued onto a short cross-reference stub were split apart and recovered (e.g. "Wesen der Religion", "Krieg"); corpus-wide sweep fixed ~4550 entries with duplicated/corrupted cross-reference arrows and the recurring "Joraels"->"Israels" OCR misread. 54 flagged entries were NOT deleted despite a "no" verdict because their full body (up to 79578 chars) was never shown to the reviewer (400-char preview) and may contain real content wrongly attached to a bad split point -- held for a follow-up pass. 11547 entries.
History_1.2=The 54 held-back entries from 1.1 merged into their preceding entry (false split points, not real headwords) rather than deleted. Note: at least one (Akkommodation Jesu) reads as a legitimate standalone topic and is now buried inside the preceding entry's body instead of independently searchable -- cross-references to it elsewhere in the text will not resolve. 11493 entries.
History_1.3=Corpus-wide headword audit (Bd. I, II, III, V, which had never been manually reviewed, unlike Bd. IV): ~100 entries recovered from a running page-header ("Unter K etwa Vermißt...") that had been wrongly extracted as their headword, hiding real distinct content (biographies, topics) behind duplicate-looking keys; 653 further false-split fragment entries (headwords that were mid-sentence clauses, not real terms, e.g. "aufs neue; dazu mußten...") merged into their preceding entry. 3 fragments at the very start of a volume (no preceding entry to merge into) remain as minor known residue. 10840 entries.
History_1.4=Completed the 1.3 headword audit: the first pass only covered ~92% of headwords (stopped partway through the alphabet); finished the remaining tail (V through Z/Ä-Ü) by the same method. 49 further fragment-headword entries merged into their preceding entry. Verified zero fragment-headwords remain corpus-wide except the same 3 known first-of-volume stragglers. 10791 entries.
History_1.5=User review pass over Bd. I headwords. Fixed extract_headword() algorithm bugs affecting the WHOLE corpus: (a) 306 entries lost their forename(s) when a person had 2+ forenames not comma-separated (e.g. "Guericke, Heinrich Ernst Ferdinand" was truncated to just "Guericke") -- now extends correctly; (b) 179 headwords ending in a stray "-"/"--" (from a "Headword -- -> Target" pattern) now strip it cleanly. Found and fixed a second running-header artifact ("Die Religion in Geschichte und Gegenwart. I/III.", the book's own printed page title) that had corrupted 301 entries, including mid-body (not just as first line) -- e.g. it was splitting the word "Verordnungen" in half inside the "Aachen" entry. Fixed ~3500 occurrences of "Ihd.<digit>" -> "Jhd." (Jahrhundert) and ~30 of "Ja ko b" -> "Jakob", both pervasive Fraktur OCR artifacts. Discovered and fixed a distinct assembly-stage bug: same-surname person clusters ("Hahn, 1. August", "Hahn, 2. Hugo", ...) reliably split their FIRST boundary but silently glued every subsequent numbered person onto the previous one's body -- 136 embedded people recovered as their own entries (validated by requiring a birth/death-date or "geb./gest." marker at the split point, to avoid false-splitting numbered outline/argument prose). Plus ~25 individual headword/OCR fixes named during review (Achan, Guericke, Eckermann, Echternach, Eucken, Ekchellensis, Exarchat, Ezechiel, Ibach + a glued "Ibaditen" stub recovered, Julius III, and others). 10916 entries.
History_1.6=User review pass over Bd. II/III (J-K range). Found the "Unter K etwa Vermißt" running-header (fixed as first-line-only in 1.3) ALSO corrupts entries mid-body like the other running title -- 596 more occurrences across 284 entries removed. Global OCR fixes: "Kir<hen"->"Kirchen" (604x), "Jsrael"->"Israel" (914x, same J/I confusion as the earlier "Jöraels" fix), stray " |" before an arrow (150x). ~26 individual headword/OCR fixes (Kabisch, Kirchbach, Kimchi, Karchemis, Kelach, and others). Found and fixed a second class of "embedded numbered sub-entries" bug beyond the 1.5 same-surname case: several entries had 2-8 further people/topics glued on with no comma-number pattern at all, requiring per-entry manual splits rather than the generic algorithm -- recovered Jochanan 2, Johanniter 2, Johansson 2, Jonas 2, Jordan 2 & 4, Judas 2 & 4, Julianus 2 & 3, the separate "Julius, Name von 3 Päpsten" entry, Katharina 2-8 (8 different saints/queens had been sharing one entry, including Katharina von Bora), the Kemosch/van der Kemp/Kempe/a Kempis cluster (4 unrelated stub entries glued together), and "Kindergottesdienst" recovered from inside "Kinderglaube". 1 pure-garbage fragment (under "Juda") merged into its predecessor. 10939 entries.
History_1.7=Located "Jesaja und Jesajabuch" (previously reported as un-findable): a 15KB article with a short unrelated "Jerusalemsverein" stub glued to the front and ~2.3KB of unreadable OCR noise (a damaged/double-exposed scan of the final page) trailing the end. Split the stub into its own entry and truncated the garbled tail rather than ship gibberish in a dictionary entry -- the last coherent sentence is preserved intact. 10940 entries.
History_1.8="Ams8dorf" -> "Amsdorf" (2 occurrences, plain OCR digit-for-letter misread in running text, not a broken entry). 10940 entries.
History_1.9=User review pass over Bd. III/IV/V (L-P range). Major latent-bug discovery made while chasing down a reported "Psalm 25 wörtlich zitiert" fragment: 36 entries (~930 KB of text, spanning the letters C, K and Z across Bd. I, III and V) turned out to be page-break continuations whose headword had silently stayed as the raw "Unter X etwa Vermißt..." running-header artifact -- these were filed under unfindable garbage keys instead of their real headword. All 36 were rejoined to their correct parent article in the right page order (e.g. the "Christologie" article had been sawn into 7 pieces this way, one of which was the reported "Psalm 25" fragment). A second, unrelated 5-way page-break fragmentation of the "Sitte und Sittlichkeit" article (incl. the reported "Liebe das oberste Gebot ist..." fragment) was found and rejoined the same way. Global fixes: stray "|J" (an OCR stand-in for the cross-reference arrow, distinct from the previously-fixed variants) -> "→" (156 occurrences). Individual headword/OCR fixes: Le<hner->Lechner, Lee/Anna->Quäker(Shakers), Leg>lität->Legalität, Lic<htmeß->Lichtmeß+Marienfeste, Landkisc<h->Lanckisch (identified as the "Lanckisch'sche Buchhandlung" concordance publisher), Lubbo>&->Lubbock, Macedonien/Magog/Marius Victorinus/Pfarrerblatt/Ploermel arrow-garble fixes, Philipp UI von->Philipp III von Hessen. Glued-entry splits (same-surname clusters and unrelated stubs sharing one body, split per standing policy): "Laach"+"Labadie, Jean" (a completely different person hidden under a cross-ref stub); the "Lambert" cluster recovered 7 separate people/topics (le Begue, von Hersfeld, von Ostia, von Spoleto, Johann Heinrich, Pierre de la Mothe, Lambertini, Lambethartikel, Lambethkonferenz, Lambeth-Quadrilateral) that had been sharing 4 entries; "Lamech" separated from an unrelated "Lamennais, Hugues Felicité Robert" glued to its end; "Lange" split into its two numbered persons; "Laplace" split into Josua/Pierre Simon plus an unrelated "La Plata" diocese stub; "Link, Wenzeslaus" separated from "von Linné, Karl"; a "Lubentius, Hessen" stub recovered from the tail of the Lubbock entry; "Magister" separated from "Magister Sacri Palatii"; "Marnix" split into its two numbered persons; a "von Müller, Johannes" (the historian) recovered from the tail of "Müller, 19. Nikolaus"; "Pfarrarchiv"/"Pfarrassistent"/"Pfarrbesetzung" separated (3 stubs sharing one entry); the "Philander von Sittewald" entry recovered 6 more independent entries (Philanthropie, Philanthropinisten, Philaret 1, Philaret 2, Philargi, Philastrius) that had all been sharing its body; "Philoponisten" separated from the front of the large "Philosophie" overview article; "Pönitentiaria" separated from an unrelated "Buße" stub; the "Protestant" entry recovered 5 more independent entries (Protestantenbibel, Protestantenbund/"Bund deutscher Protestanten", Remonstrantenbund, Protestantenedikt, Protestantengesangbuch) that had all been sharing its body; "Protoplasten" split into Protoplasten/Protopope/Protopresbyter; "Psalmendichtung" split from "Psalmodie" (plus "IIsrael"->"Israel"); "Prüzision" separated from an unrelated, much larger "Prag" article (diocese + university history). Reviewed and left unchanged after finding no defect: "Lust und Unlust", "Protestantisch als Konfessionsbezeichnung", "Pfingstbewegung", and the main "Propaganda" article. 10936 entries.
History_1.10=User review pass over Bd. IV/V (Q-Z range). Found a new latent bug class while investigating "VII"/"XVL"/"III" fragments the user flagged: 7 Pope/Antipope biographies had lost their name entirely, leaving only a bare Roman numeral as headword (unfindable) -- recovered as Benedikt XIV, Clemens VII (1 and 2, antipope and pope), Gregor XVI, Hadrian III, Urban VII, Urban VIII. Two more page-break fragmentation chains found and merged into their real articles: the "Griechenland" overview (its Greek-religion section had a physically damaged/illegible scan opening, salvaged as best as legible) and the "Wagner" person-cluster (recovered a stray "-- Vaillance; ..." bibliography-list fragment as the tail of Wagner, 2. Charles). Also recovered a 5.5 KB "Tüchtige Arbeiter müssen..." article on parish/pastoral organization (Emil Sulze's Gemeindeideal) that had no usable headword, and merged two smaller orphaned fragments (a Kirchenlied-history continuation starting "Reformierten", die noch..."; a Seelsorge continuation starting "Tüchtige Arbeiter..." originally mis-identified as needing a merge, corrected in-place instead). Glued-entry splits (short cross-reference stubs found tacked onto the tail of the preceding, unrelated biography -- a new variant of the recurring glue bug, distinct from previous rounds' front-glued stubs): Quatember/Quattrocento, Rabula/Raccolta, Rade Martin/Radegundis, Quenstedt/della Quercia, a 4-way Delitzsch-2/della Quercia(dup)/della Robbia/della Volpe cluster, Rafaelverein/Raffael, a 3-way Raith/Rakau/Rakauer Katechismus, Raphaelsverein/Rapoport, Sarto Giuseppe/del Sarto Andrea, Sattler 1/2, a 6-way Sirach/Sirampur/Sirenen/Siricius/Sirmond/Sisak cluster, a 3-way Spolienrecht/Sponsores/Sporn cluster, Young 1/2, and a Salerno/"von Sales, Franz" (patron-saint congregations list, itself reassembled from 3 page-broken pieces) split. Individual headword/OCR fixes (mostly the recurring "<" for "ch" Fraktur misread): Sachs Hans, Zwick Johannes (was "Zwid"), Zscharnack Leopold, Zschokke, Zanchius, Starck/Starke (Johann Friedrich and Christoph, two distinct Pietist authors previously sharing garbled near-identical headwords), Sabäer und Sabäische Religion, Sagansche Methode, Sapientiae christianae, Zürcherbibel, Waadtland, Waisenhaus Hallesches, plus arrow-OCR-variant cleanups ("7", "R", "%", "*", "„N", "N", "9" all standing for "→" depending on context) across Rauchaltar, Rabbulas, Taborfest, Tanera, Yi-King, Thrazien, Züricher Konsens, Tübinger und Gießener christologischer Streit, and others. Reviewed and left unchanged after finding no defect: "Lust und Unlust"-style already-correct cross-refs, the "Ratio legis"/"Raphael"/"Raimund" entries themselves (already fine; only their neighboring stubs were glued), and the "Tholuck"/"Tübinger Schule"/"Waadtland"/"Thrazien"/"Tabu"/"Einigungsbestrebungen"/"Raimund von Toulouse" mentions the user's search happened to surface, which are ordinary body-text references inside unrelated correct articles, not broken entries themselves. 10953 entries.
History_1.11=Automated QA pass: all 10953 entries batch-screened by a local Ollama model (gemma2:9b, calibrated prompt after gemma3:latest proved unreliable) for severe unreadable OCR garbage, glued topics, headword/content mismatch, and fragments. Of 1096 raw flags, manual spot-checking found the GLUED/MISMATCH/FRAGMENT categories dominated by false positives (the model has no historical world-knowledge, e.g. it flagged "Clemens VII" as mismatched with its own occupant Giulio Medici, and routinely misread ordinary multi-target cross-ref stubs as "glued"); the SEVERE category was far more precise and yielded 9 genuine finds, fixed here: headword-only garbles Ehrle/Ehses; a "Hohelied" continuation recovered from under a nonsense key (with an unrecoverable mid-paragraph scan-damage line dropped); a badly damaged ~19KB continuation of the "Jesaja und Jesajabuch" article (Isaiah 17-20 judgment oracles) recovered and appended, marked as scan-damaged since much of it could not be fully reconstructed; a "Kinderarbeit" table-of-contents page whose dot-leader OCR had turned to noise, recovered (noise dropped, the readable statistics prose kept); a "Waldenser" origin-question continuation recovered from under a nonsense key; and headword/text cleanups for Racine, "Kongregation, Windesheimer", "Sonntagsblätter/-boten/-grüße", the "Thomas, 8/9/10" tail (von Villanova/de Vio-Cajetan/of Walden-Netter), and a "Zeitschriften" cross-reference list. The ~1000 non-SEVERE flags were not applied -- they were reviewed in aggregate/sample only and would need manual triage before acting on any individual one. 10949 entries.
History_1.12=Follow-up on the Ollama QA check: ran the identical calibration sample through Claude directly as a head-to-head comparison. Claude found 3 clean glued-entry bugs the Ollama model missed entirely (it produced only false positives on the same sample) -- fixed here: "Aussperrung" separated from the unrelated "Ausstattung, kirchliche" article; "Kreuzzeitung" separated from the unrelated "Kreuzzüge" article; "Streaneshalch, Synode von" (Synod of Whitby, 664) separated from the unrelated "Streif" stub. Also split a 5-way glued "Pastor Hermä" cluster found during the same review (Pastor Hermä / Pastoralblätter / Pastoralbriefe / Pastoralseminar, Göttinger / Pastoralkonferenzen, five distinct cross-reference topics that had been sharing one entry). 10956 entries.
About=Automatisiert per Fraktur-OCR (tesseract --l frk) aus den gemeinfreien Scans (archive.org) extrahiert und mit heuristischer Eintrags-/Stichwortextraktion aufbereitet. Ein Teil der automatisch als auffaellig markierten Eintraege (Alphabet-Anomalien, sehr kurze Eintraege, geringe Uebereinstimmung mit dem modernen RGG4-Register) wurde manuell durchgesehen und korrigiert; die Extraktion bleibt an einzelnen Stellen unvollkommen (Fraktur-OCR-Fehler, falsch getrennte Eintraege). Nicht zu verwechseln mit dem modernen, urheberrechtlich geschuetzten RGG (4. Aufl., Brill).
